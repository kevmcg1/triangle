/* turns "6.123e-17" into the full, non-scientific decimal string it
   represents — a pure string transform, so it works from the already-
   displayed text with no need for the original number. */
function expandExponential(str) {
  const m = str.match(/^(-?)(\d+)(?:\.(\d+))?e([+-]?\d+)$/i);
  if (!m) return str;
  const sign = m[1], digits = m[2] + (m[3] || ""), exp = parseInt(m[4], 10);
  const pointPos = m[2].length + exp;
  let out;
  if (pointPos <= 0) out = "0." + "0".repeat(-pointPos) + digits;
  else if (pointPos >= digits.length) out = digits + "0".repeat(pointPos - digits.length);
  else out = digits.slice(0, pointPos) + "." + digits.slice(pointPos);
  if (out.indexOf(".") >= 0) out = out.replace(/0+$/, "").replace(/\.$/, "");
  return sign + out;
}
/* any number rendered in scientific notation becomes click-to-expand,
   so a value like 6.123e-17 can be inspected in full */
function makeExponentsClickable(container) {
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const targets = [];
  let node;
  while ((node = walker.nextNode())) if (/-?\d+(?:\.\d+)?e[+-]?\d+/i.test(node.nodeValue)) targets.push(node);
  targets.forEach(n => {
    const parts = n.nodeValue.split(/(-?\d+(?:\.\d+)?e[+-]?\d+)/i);
    const frag = document.createDocumentFragment();
    parts.forEach(part => {
      if (/^-?\d+(?:\.\d+)?e[+-]?\d+$/i.test(part)) {
        const span = document.createElement("span");
        span.className = "expandable";
        span.textContent = part;
        span.dataset.short = part;
        span.dataset.full = expandExponential(part);
        span.dataset.tip = "Click to see the full value"; span.dataset.tipPos = "top";
        frag.appendChild(span);
      } else if (part) frag.appendChild(document.createTextNode(part));
    });
    n.parentNode.replaceChild(frag, n);
  });
}
/* clicking any colored variable or number in the equation — a, B, R,
   the "C" in x_C, whatever — points at exactly what it refers to on
   the triangle: a side, a vertex/angle, or a circle */
const VAR_HIGHLIGHT = {
  a: { kind: "side", i: 0 }, b: { kind: "side", i: 1 }, c: { kind: "side", i: 2 },
  A: { kind: "vertex", i: 0 }, B: { kind: "vertex", i: 1 }, C: { kind: "vertex", i: 2 },
  R: { kind: "circle", which: "circ", mode: "radius" },
  r: { kind: "circle", which: "in", mode: "radius" },
  s: { kind: "all" }, area: { kind: "all" }
};
modalRoot.addEventListener("click", e => {
  const exp = e.target.closest(".expandable");
  if (exp) {
    const full = exp.classList.toggle("expanded");
    exp.textContent = full ? exp.dataset.full : exp.dataset.short;
    return;
  }
  if (e.target.closest(".copy-btn")) return; /* handled by its own listener */
  const v = e.target.closest("[data-hl], .var, .numv");
  if (!v) return;
  let hl = null, key = null;
  if (v.dataset.hl) { hl = JSON.parse(v.dataset.hl); key = "data:" + v.dataset.hl; }
  else {
    const m = v.className.match(/\bvar-([A-Za-z]+)\b/);
    if (m && VAR_HIGHLIGHT[m[1]]) { hl = VAR_HIGHLIGHT[m[1]]; key = "var:" + m[1]; }
  }
  if (!hl) return;
  S.highlight = hl; S.highlightKey = key;
  markActiveHighlight();
  requestRender();
});
/* outlines every value in the panel that points at what's currently
   highlighted — clicking one "a" lights up every "a", so you can see
   where that quantity flows through the whole derivation */
function markActiveHighlight() {
  const body = document.getElementById("mBody");
  body.querySelectorAll(".hl-on").forEach(el => el.classList.remove("hl-on"));
  const key = S.highlightKey;
  if (!key) return;
  if (key.startsWith("data:")) {
    const want = key.slice(5);
    body.querySelectorAll("[data-hl]").forEach(el => { if (el.dataset.hl === want) el.classList.add("hl-on"); });
  } else {
    body.querySelectorAll(".var-" + key.slice(4)).forEach(el => el.classList.add("hl-on"));
  }
}

/* the panel is a real flex item (see #stage/#viewport) — opening or
   closing it actually resizes the canvas, so this drives that resize
   every frame exactly like the sidebar's own open/close animation does,
   instead of animating a CSS property the canvas wouldn't notice. */
let panelAnim = null;
function setPanelOpen(open, targetPx, ms, keepState) {
  if (panelAnim) cancelAnimationFrame(panelAnim);
  const from = modalRoot.getBoundingClientRect().height;
  const to = open ? targetPx : 0;
  const t0 = performance.now(), dur = ms === undefined ? 260 : ms;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = clamp((now - t0) / dur, 0, 1);
    modalRoot.style.height = (from + (to - from) * ease(t)) + "px";
    resize();
    if (t < 1) { panelAnim = requestAnimationFrame(step); }
    else {
      panelAnim = null;
      modalRoot.style.height = to + "px";
      resize();
      /* keepState: only tucked away for view-only, not closed — the open
         explanation (and its highlight) comes back when view-only ends */
      if (!open && keepState) { requestRender(); }
      else if (!open) { modalRoot.classList.remove("show"); S.highlight = null; S.highlightKey = null; S.activeExplain = null; modalPainted = null; requestRender(); }
      else if (!keepState) { modalRoot.classList.add("show"); fitView(150, 420); }
    }
  };
  panelAnim = requestAnimationFrame(step);
}

/* --- copy-to-clipboard: every equation line and every big value gets a
   button. navigator.clipboard needs a secure context and can silently
   fail when this file is opened as a bare file:// page, so there's
   always a working fallback via a hidden textarea + execCommand. */
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand("copy"); } catch (_) {}
  document.body.removeChild(ta);
}
function copyText(text, btn) {
  const flash = () => {
    if (!btn) return;
    const icon = btn.querySelector("i");
    const prevClass = icon.className;
    btn.classList.add("copied"); icon.className = "fa-solid fa-check";
    setTimeout(() => { btn.classList.remove("copied"); icon.className = prevClass; }, 900);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flash).catch(() => { fallbackCopy(text); flash(); });
  } else { fallbackCopy(text); flash(); }
}
function addCopyButtons(container) {
  container.querySelectorAll(".eqn-line").forEach(line => {
    const text = line.textContent.trim();
    if (!text) return;
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.type = "button";
    btn.dataset.tip = "Copy this line"; btn.dataset.tipPos = "left"; btn.setAttribute("aria-label", "Copy this line");
    btn.innerHTML = '<i class="fa-solid fa-copy"></i>';
    btn.addEventListener("click", e => { e.stopPropagation(); copyText(text, btn); });
    line.appendChild(btn);
  });
  container.querySelectorAll(".bigv").forEach(box => {
    const numEl = box.querySelector(".num");
    if (!numEl) return;
    const text = numEl.textContent.trim();
    const btn = document.createElement("button");
    btn.className = "copy-btn copy-btn-bigv"; btn.type = "button";
    btn.dataset.tip = "Copy this value"; btn.dataset.tipPos = "left"; btn.setAttribute("aria-label", "Copy this value");
    btn.innerHTML = '<i class="fa-solid fa-copy"></i>';
    btn.addEventListener("click", e => { e.stopPropagation(); copyText(text, btn); });
    box.appendChild(btn);
  });
}
/* writes the title/body without touching the panel's open/close animation
   — used both for the initial open and for every live refresh while it's
   already open, so dragging or typing updates the math in place */
/* the live refresh calls this on every render, but most renders (a hover,
   a zoom frame, the panel's own open animation) don't change a single
   number in it. Rebuilding the DOM anyway threw away hover state, any
   text selection, and — if it landed between mousedown and mouseup —
   the click itself, since the element pressed no longer existed. */
let modalPainted = null;
function paintModalContent(title, bodyHtml, force) {
  const key = title + "\u0000" + bodyHtml;
  if (!force && key === modalPainted) return;
  modalPainted = key;
  document.getElementById("mTitle").textContent = title;
  const mBody = document.getElementById("mBody");
  mBody.innerHTML = bodyHtml;
  makeExponentsClickable(mBody);
  addCopyButtons(mBody);
  markActiveHighlight();
}

function openModal(title, bodyHtml) {
  S.highlightKey = null; /* a freshly opened explanation starts on its row's own highlight */
  paintModalContent(title, bodyHtml, true);
  modalRoot.classList.add("show");
  /* measure the content's natural height synchronously (no paint happens
     between these writes, so there's no visible flicker), then animate
     from the panel's current height up to that — capped so it can never
     swallow the whole viewport */
  const prevHeight = modalRoot.style.height || "0px";
  modalRoot.style.height = "auto";
  const natural = modalRoot.scrollHeight;
  modalRoot.style.height = prevHeight;
  void modalRoot.offsetHeight;
  const target = Math.min(natural, stage.clientHeight * 0.5);
  setPanelOpen(true, target);
}
function closeModal() { setPanelOpen(false, 0); }

/* approx is a clean closed form (a fraction or a multiple of π) — only
   shown when the geometry actually produces one. Without it there's
   nothing to contrast against, so just the plain value gets shown. */
function bigv(label, approx, exact) {
  if (!approx) return '<div class="big"><div class="bigv"><div class="lbl">Value</div><div class="num">' + exact + '</div></div></div>';
  return '<div class="big"><div class="bigv"><div class="lbl">Approximate</div><div class="num">' + approx + '</div></div>' +
         '<div class="bigv"><div class="lbl">Exact</div><div class="num">' + exact + '</div></div></div>';
}

/* --- equation-building helpers: colored parameters + real fraction bars - */
const V  = (sym, letter) => '<span class="var var-' + letter + '">' + sym + '</span>';
const N  = text => '<span class="numv">' + text + '</span>';
/* a *substituted* number that stands in for a named variable (a, B, R, …)
   keeps that variable's color — the color thread has to survive past the
   symbolic line, all the way through to the number itself, or it reads
   as broken the moment real values appear */
const NC2 = (text, letter) => '<span class="numv var-' + letter + '">' + text + '</span>';
/* a number with no variable color of its own, but that still maps to a
   real feature on the canvas — clicking it highlights exactly that (hl
   is a drawHighlight descriptor; kept JSON-plain so it survives as an
   attribute across the panel's live repaints) */
const NH = (text, hl) => "<span class=\"numv hlv\" data-hl='" + JSON.stringify(hl) + "'>" + text + '</span>';
const FR = (numHtml, denHtml) => '<span class="frac"><span class="num">' + numHtml + '</span><span class="den">' + denHtml + '</span></span>';
/* a real subscript ("x" with a small lowered "A"), not the "x_A"
   underscore-text placeholder — reads as actual math notation */
const VS = (base, sub, letter) => '<span class="var var-' + letter + '">' + base + '<sub>' + sub + '</sub></span>';
const NS = (base, sub) => '<span class="numv">' + base + '<sub>' + sub + '</sub></span>';
/* the content is wrapped in its own span rather than sitting directly
   inside the flex row: a flex container trims the whitespace at the
   EDGES of each of its own direct text-node children, so plain text
   mixed straight in with <span> variables ("vertices " + V(...) + "
   and " + ...) silently loses the spaces next to every span and reads
   as "verticesBandC". One wrapper per line sidesteps that entirely —
   everything inside it is ordinary inline content again. */
const EL = html => '<div class="eqn-line"><span class="eqn-content">' + html + '</span></div>';
const BOXED = html => '<div class="eqn-line eqn-final"><span class="eqn-content">' + html + '</span></div>';
/* a one/two-sentence aside explaining why a unit or representation
   conversion is happening right here — always placed between the line
   that ends in the old unit and the line that starts using the new one */
const NOTE = text => '<div class="eqn-line eqn-note"><i class="fa-solid fa-circle-info"></i><span class="eqn-content">' + text + '</span></div>';
const EQN = lines => '<div class="eqn">' + lines.join("") + '</div>';

/* every quantity that appears mid-derivation carries its unit — these
   always attach one. Every constant is a numeral — never spelled out
   as a word — in every line, symbolic or substituted alike. */
const WORD = { 2: "2", 3: "3", 4: "4" };
/* every substituted number in a derivation step shows its decimal value
   first, with a clean fraction (or, for radians, a π-multiple) appended
   in parentheses whenever one genuinely exists for that value — never
   just for an arbitrary irrational result (see niceRatio's tolerance) */
const ulen   = (inches, U) => { const v = inches / LEN[U].f; const f = fractionStr(v); return dp(v) + " " + LEN[U].sym + (f ? " (" + f + " " + LEN[U].sym + ")" : ""); };
const ulenSq = (inches, U) => { const v = inches / LEN[U].f, sq = v * v; const f = fractionStr(sq); return dp(sq) + " " + LEN[U].sym + "²" + (f ? " (" + f + " " + LEN[U].sym + "²)" : ""); };
const uarea  = (sqin,  U) => { const v = sqin / (LEN[U].f * LEN[U].f); const f = fractionStr(v); return dp(v) + " " + LEN[U].sym + "²" + (f ? " (" + f + " " + LEN[U].sym + "²)" : ""); };
const udeg   = rad => dp(deg(rad)) + "°";
const urad   = rad => { const p = piStr(rad); return dp(rad) + " rad" + (p ? " (" + p + " rad)" : ""); };
/* a substituted coordinate/position value: negatives get parenthesized
   so "− -0.8" never appears as "minus minus", and a clean fraction (if
   one exists) is appended after, outside that guard */
function ncpFmt(inches, U, letter) {
  const v = snapNoise(inches, Math.max(...sidesOf(S.P))) / LEN[U].f;
  const s = dp(v);
  const guarded = s.charAt(0) === "-" ? "(" + s + ")" : s;
  const f = fractionStr(v);
  return NC2(guarded + (f ? " (" + f + ")" : ""), letter);
}
/* a plain unitless computed value (a cosine, a ratio) — decimal first,
   clean fraction in parens after, when one exists */
function NF(v) {
  if (!isFinite(v)) return N(dp(v));
  const f = fractionStr(v);
  return N(dp(v) + (f ? " (" + f + ")" : ""));
}
/* NF, but clickable — highlights hl on the canvas */
function NFH(v, hl) {
  if (!isFinite(v)) return NH(dp(v), hl);
  const f = fractionStr(v);
  return NH(dp(v) + (f ? " (" + f + ")" : ""), hl);
}

function openExplain(id, live) {
  const D = derive();
  const U = S.lenUnit;
  const info = rowMeta[id];
  if (!live) {
    S.highlight = info || null;
    S.activeExplain = { kind: "stat", id };
    requestRender();
  }

  const names = ["A", "B", "C"], lname = ["a", "b", "c"];
  const NL  = inches => N(ulen(inches, U));
  const NLQ = inches => N(ulenSq(inches, U));
  const NA  = sqin   => N(uarea(sqin, U));
  const ND  = rad    => N(udeg(rad));
  const NR  = rad    => N(urad(rad));
  const NC  = inches => { const v = inches / LEN[U].f, f = fractionStr(v); return N(dp(v) + (f ? " (" + f + ")" : "")); }; /* coordinate — a position, not a measurement, so no unit */
  /* colored counterparts — a substituted number that stands in for a
     named variable keeps that variable's color, all the way to the end */
  const NLc  = (inches, letter) => NC2(ulen(inches, U), letter);
  const NLQc = (inches, letter) => NC2(ulenSq(inches, U), letter);
  const NAc  = (sqin, letter)   => NC2(uarea(sqin, U), letter);
  const NDc  = (rad, letter)    => NC2(udeg(rad), letter);
  const NRc  = (rad, letter)    => NC2(urad(rad), letter);
  /* clickable counterparts for results with no variable color of their
     own — each highlights the feature it measures (see NH) */
  const NLH  = (inches, hl) => NH(ulen(inches, U), hl);
  const NAH  = (sqin, hl)   => NH(uarea(sqin, U), hl);
  const NCH  = (inches, hl) => { const v = inches / LEN[U].f, f = fractionStr(v); return NH(dp(v) + (f ? " (" + f + ")" : ""), hl); };
  let title = "", lines = [], approxS = "", exactS = "";

  if (id === "a" || id === "b" || id === "c") {
    const i = { a: 0, b: 1, c: 2 }[id];
    const j = (i + 1) % 3, k = (i + 2) % 3;
    const ncp0 = (inches, letter) => ncpFmt(inches, U, letter);
    title = "Side " + lname[i] + " (" + names[j] + names[k] + ")";
    lines = [
      EL("Distance formula between vertices " + V(names[j], names[j]) + " and " + V(names[k], names[k]) + ":"),
      EL(V(lname[i], lname[i]) + " = √[(x₂−x₁)² + (y₂−y₁)²]"),
      EL(V(lname[i], lname[i]) + " = √[(" + ncp0(S.P[k].x, names[k]) + " − " + ncp0(S.P[j].x, names[j]) + ")² + (" + ncp0(S.P[k].y, names[k]) + " − " + ncp0(S.P[j].y, names[j]) + ")²]"),
      BOXED(V(lname[i], lname[i]) + " = " + NLc(D.sides[i], lname[i]))
    ];
    approxS = lenSymbolic(D.sides[i], U); exactS = lenDecimal(D.sides[i], U);
  } else if (id === "A" || id === "B" || id === "C") {
    const i = { A: 0, B: 1, C: 2 }[id];
    title = "Angle " + names[i] + " — Law of Cosines";
    const L = lawLines(D, i);
    const vA = V(names[i], names[i]);
    const r = (v, n) => +v.toFixed(n);
    /* cos printed precisely enough that arccos of the PRINTED cos gives
       the printed angle — at 4 decimals alone, arccos(0.2714) can land a
       few thousandths of a degree away from the angle shown */
    const angTxt = fmt(deg(D.ang[i]), S.prec);
    let nc = 15;
    for (let n = S.prec; n <= 15; n++) if (fmt(deg(Math.acos(clamp(r(L.cos, n), -1, 1))), S.prec) === angTxt) { nc = n; break; }
    /* same idea for the degree → radian step: the degrees are printed
       with enough decimals that multiplying them by π/180 prints as the
       radian value shown */
    const radTxt = fmt(D.ang[i], S.prec);
    let nd = 15;
    for (let n = S.prec; n <= 15; n++) if (fmt(r(deg(D.ang[i]), n) * Math.PI / 180, S.prec) === radTxt) { nd = n; break; }
    lines = [
      EL(L.cosLine(nc)),
      EL(vA + " = arccos(" + NH(fmt(L.cos, nc), { kind: "vertex", i }) + ") = " + NC2(angTxt + "°", names[i])),
      NOTE("arccos returns the angle itself; it can be written in degrees or in radians. Radians are what the arc-length and area formulas need, and 180° = π rad, so degrees × π/180 = radians: " + N(fmt(deg(D.ang[i]), nd) + "°") + " × π/180 = " + NRc(D.ang[i], names[i]) + "."),
      BOXED(vA + " = " + NDc(D.ang[i], names[i]) + " = " + NRc(D.ang[i], names[i]))
    ];
    approxS = angSymbolic(D.ang[i]); exactS = angDecimal(D.ang[i]);
  } else if (id === "sum") {
    title = "Angle sum";
    lines = [
      EL(V("A", "A") + " + " + V("B", "B") + " + " + V("C", "C") + " = 180° — an exact identity for any planar triangle, not a measurement."),
      NOTE("180° is shown in radians too since that's the unit trig functions use internally: 180° × (π/180) = π rad."),
      BOXED(V("A", "A") + " + " + V("B", "B") + " + " + V("C", "C") + " = 180° = π rad")
    ];
    approxS = angSymbolic(Math.PI); exactS = angDecimal(Math.PI);
  } else if (id === "area") {
    title = "Area — Shoelace formula";
    const xA = VS("x", "A", "A"), yA = VS("y", "A", "A"), xB = VS("x", "B", "B"), yB = VS("y", "B", "B"), xC = VS("x", "C", "C"), yC = VS("y", "C", "C");
    const ncp = (inches, letter) => ncpFmt(inches, U, letter);
    const [pA, pB, pC] = S.P;
    lines = [
      EL("Area = " + FR("1", "2") + " |" + xA + "(" + yB + "−" + yC + ") + " + xB + "(" + yC + "−" + yA + ") + " + xC + "(" + yA + "−" + yB + ")|"),
      EL("Area = " + FR("1", "2") + " |" +
         ncp(pA.x, "A") + "(" + ncp(pB.y, "B") + " − " + ncp(pC.y, "C") + ") + " +
         ncp(pB.x, "B") + "(" + ncp(pC.y, "C") + " − " + ncp(pA.y, "A") + ") + " +
         ncp(pC.x, "C") + "(" + ncp(pA.y, "A") + " − " + ncp(pB.y, "B") + ")|"),
      EL("Area = " + FR("1", "2") + " · |" + NAc(2 * D.area, "area") + "|"),
      BOXED("Area = " + NAc(D.area, "area"))
    ];
    approxS = areaSymbolic(D.area, U); exactS = areaDecimal(D.area, U);
  } else if (id === "per") {
    title = "Perimeter";
    lines = [
      EL("Perimeter = " + V("a", "a") + " + " + V("b", "b") + " + " + V("c", "c")),
      EL("Perimeter = " + NLc(D.a, "a") + " + " + NLc(D.b, "b") + " + " + NLc(D.c, "c")),
      BOXED("Perimeter = " + NLH(D.per, { kind: "all" }))
    ];
    approxS = lenSymbolic(D.per, U); exactS = lenDecimal(D.per, U);
  } else if (id === "semi") {
    title = "Semiperimeter";
    lines = [
      EL(V("s", "s") + " = " + FR(V("a", "a") + " + " + V("b", "b") + " + " + V("c", "c"), "2")),
      EL(V("s", "s") + " = " + FR(NLc(D.a, "a") + " + " + NLc(D.b, "b") + " + " + NLc(D.c, "c"), "2")),
      BOXED(V("s", "s") + " = " + NLc(D.s, "s"))
    ];
    approxS = lenSymbolic(D.s, U); exactS = lenDecimal(D.s, U);
  } else if (id === "R" || id === "Rd") {
    title = id === "R" ? "Circumradius" : "Circumdiameter";
    lines = [
      EL(V("R", "R") + " = " + FR(V("a", "a") + " · " + V("b", "b") + " · " + V("c", "c"), "4 · " + V("Area", "area"))),
      EL(V("R", "R") + " = " + FR(NLc(D.a, "a") + " · " + NLc(D.b, "b") + " · " + NLc(D.c, "c"), "4 · " + NAc(D.area, "area")))
    ];
    if (id === "Rd") {
      lines.push(BOXED(V("R", "R") + " = " + NLc(D.R, "R")));
      lines.push(EL("Diameter = 2 · " + V("R", "R")));
      lines.push(BOXED("Diameter = 2 · " + NLc(D.R, "R") + " = " + NLH(2 * D.R, { kind: "circle", which: "circ", mode: "diameter" })));
    } else {
      lines.push(BOXED(V("R", "R") + " = " + NLc(D.R, "R")));
    }
    /* the same R from the Law of Sines — where the circumradius comes
       from in the first place: every side divided by the sine of its
       opposite angle is the circle's diameter */
    const sinA = lawLines(D, 0).sin, fU = LEN[U].f, symU = LEN[U].sym;
    const twoR = dp(2 * D.R / fU);
    /* a and sin A printed precisely enough that dividing them by hand
       prints exactly as the 2R shown */
    let nS = 15;
    for (let n = S.prec; n <= 15; n++) if (dp(+(D.a / fU).toFixed(n) / +sinA.toFixed(n)) === twoR) { nS = n; break; }
    lines.push(NOTE("Check with the Law of Sines: " + V("a", "a") + " ÷ sin " + V("A", "A") + " = " + V("b", "b") + " ÷ sin " + V("B", "B") + " = " + V("c", "c") + " ÷ sin " + V("C", "C") + " = 2" + V("R", "R") + ". Here " +
      V("a", "a") + " ÷ sin " + V("A", "A") + " = " + NC2(fmt(D.a / fU, nS) + " " + symU, "a") + " ÷ " + NH(fmt(sinA, nS), { kind: "vertex", i: 0 }) +
      " = " + NH(twoR + " " + symU, { kind: "circle", which: "circ", mode: "diameter" }) + " = 2 · " + NLc(D.R, "R") + "."));
    const v = id === "R" ? D.R : 2 * D.R;
    approxS = lenSymbolic(v, U); exactS = lenDecimal(v, U);
  } else if (id === "r" || id === "rd") {
    title = id === "r" ? "Inradius" : "Incircle diameter";
    lines = [
      EL(V("r", "r") + " = " + FR(V("Area", "area"), V("s", "s"))),
      EL(V("r", "r") + " = " + FR(NAc(D.area, "area"), NLc(D.s, "s")))
    ];
    if (id === "rd") {
      lines.push(BOXED(V("r", "r") + " = " + NLc(D.r, "r")));
      lines.push(EL("Diameter = 2 · " + V("r", "r")));
      lines.push(BOXED("Diameter = 2 · " + NLc(D.r, "r") + " = " + NLH(2 * D.r, { kind: "circle", which: "in", mode: "diameter" })));
    } else {
      lines.push(BOXED(V("r", "r") + " = " + NLc(D.r, "r")));
    }
    const v = id === "r" ? D.r : 2 * D.r;
    approxS = lenSymbolic(v, U); exactS = lenDecimal(v, U);
  } else if (id === "inA" || id === "cirA") {
    const letter = id === "inA" ? "r" : "R";
    const radius = id === "inA" ? D.r : D.R;
    title = id === "inA" ? "Incircle area" : "Circumcircle area";
    lines = [
      EL("Area = π · " + V(letter, letter) + "²"),
      EL("Area = π · (" + NLc(radius, letter) + ")²" + " = π · " + NAc(radius * radius, letter)),
      BOXED("Area = " + NAH(Math.PI * radius * radius, { kind: "circle", which: id === "inA" ? "in" : "circ", mode: "radius" }))
    ];
    approxS = areaSymbolic(Math.PI * radius * radius, U);
    exactS = areaDecimal(Math.PI * radius * radius, U);
  } else if (/^arcC/.test(id)) {
    const i = +id.slice(4);
    title = "Circumcircle arc opposite " + names[i];
    lines = [
      EL("By the inscribed angle theorem, the central angle over this chord is 2 · " + V(names[i], names[i]) + "."),
      EL("Arc = " + V("R", "R") + " · (2 · " + V(names[i], names[i]) + ")"),
      EL("Arc = " + NLc(D.R, "R") + " · (2 · " + NDc(D.ang[i], names[i]) + ")"),
      NOTE("The arc-length formula (radius × central angle) only works when the angle is in radians, so 2 × " + N(dp(deg(D.ang[i]))) + "° is converted here: 2 × " + N(dp(deg(D.ang[i]))) + "° × (π/180) = " + NRc(2 * D.ang[i], names[i]) + "."),
      EL("Arc = " + NLc(D.R, "R") + " · " + NRc(2 * D.ang[i], names[i])),
      BOXED("Arc = " + NLH(D.arcCirc[i], { kind: "arcCirc", i }))
    ];
    approxS = lenSymbolic(D.arcCirc[i], U); exactS = lenDecimal(D.arcCirc[i], U);
  } else if (/^arcI/.test(id)) {
    const i = +id.slice(4);
    title = "Incircle arc between the tangent points at " + names[i];
    lines = [
      EL("The incircle touches the two sides that meet at " + V(names[i], names[i]) + ". The radii to those two touch points are perpendicular to the sides, so with " + V(names[i], names[i]) + " they make a quadrilateral with two 90° corners; its angles sum to 2π, leaving a central angle of π − " + V(names[i], names[i]) + " between the radii."),
      EL("Arc = " + V("r", "r") + " · (π − " + V(names[i], names[i]) + ")"),
      EL("Arc = " + NLc(D.r, "r") + " · (" + N(dp(Math.PI) + " rad") + " − " + NRc(D.ang[i], names[i]) + ") = " + NLc(D.r, "r") + " · " + NRc(Math.PI - D.ang[i], names[i])),
      BOXED("Arc = " + NLH(D.arcIn[i], { kind: "arcIn", i }))
    ];
    approxS = lenSymbolic(D.arcIn[i], U); exactS = lenDecimal(D.arcIn[i], U);
  } else if (/^h\d$/.test(id)) {
    const i = +id[1];
    title = "Altitude from " + names[i];
    lines = [
      EL("h = " + FR("2 · " + V("Area", "area"), V(lname[i], lname[i]))),
      EL("h = " + FR("2 · " + NAc(D.area, "area"), NLc(D.sides[i], lname[i]))),
      BOXED("h = " + NLH(D.alt[i], { kind: "cevian", type: "alt", i }))
    ];
    approxS = lenSymbolic(D.alt[i], U); exactS = lenDecimal(D.alt[i], U);
  } else if (/^m\d$/.test(id)) {
    const i = +id[1], j = (i + 1) % 3, k = (i + 2) % 3;
    title = "Median from " + names[i];
    lines = [
      EL("m = " + FR("1", "2") + " · √(2" + V(lname[j] + "²", lname[j]) + " + 2" + V(lname[k] + "²", lname[k]) + " − " + V(lname[i] + "²", lname[i]) + ")"),
      EL("m = " + FR("1", "2") + " · √(2 · " + NLQc(D.sides[j], lname[j]) + " + 2 · " + NLQc(D.sides[k], lname[k]) + " − " + NLQc(D.sides[i], lname[i]) + ")"),
      BOXED("m = " + NLH(D.med[i], { kind: "cevian", type: "med", i }))
    ];
    approxS = lenSymbolic(D.med[i], U); exactS = lenDecimal(D.med[i], U);
  } else if (/^t\d$/.test(id)) {
    const i = +id[1], j = (i + 1) % 3, k = (i + 2) % 3;
    title = "Angle bisector from " + names[i];
    lines = [
      EL("t = " + FR("2 · " + V(lname[j], lname[j]) + " · " + V(lname[k], lname[k]), V(lname[j], lname[j]) + " + " + V(lname[k], lname[k])) + " · cos" + FR(V(names[i], names[i]), "2")),
      EL("t = " + FR("2 · " + NLc(D.sides[j], lname[j]) + " · " + NLc(D.sides[k], lname[k]), NLc(D.sides[j], lname[j]) + " + " + NLc(D.sides[k], lname[k])) + " · cos(" + NDc(D.ang[i] / 2, names[i]) + ")"),
      EL("t = " + NLH((2 * D.sides[j] * D.sides[k]) / (D.sides[j] + D.sides[k]), { kind: "cevian", type: "bis", i }) + " · " + NFH(Math.cos(D.ang[i] / 2), { kind: "vertex", i })),
      BOXED("t = " + NLH(D.bis[i], { kind: "cevian", type: "bis", i }))
    ];
    approxS = lenSymbolic(D.bis[i], U); exactS = lenDecimal(D.bis[i], U);
  } else if (id === "Rr") {
    title = "Circumradius / Inradius";
    lines = [
      EL(FR(V("R", "R"), V("r", "r")) + " = " + FR(NLc(D.R, "R"), NLc(D.r, "r"))),
      BOXED(V("R", "R") + "⁄" + V("r", "r") + " = " + NF(D.R / D.r)),
      EL("Euler's inequality guarantees " + V("R", "R") + "⁄" + V("r", "r") + " ≥ 2, with equality only for an equilateral triangle.")
    ];
    approxS = plainSymbolic(D.R / D.r); exactS = plainDecimal(D.R / D.r);
  } else if (/^p[ABC]$/.test(id)) {
    const i = { pA: 0, pB: 1, pC: 2 }[id];
    const sc = Math.max(D.a, D.b, D.c);
    const vx = snapNoise(S.P[i].x, sc) / LEN[U].f, vy = snapNoise(S.P[i].y, sc) / LEN[U].f;
    title = "Vertex " + names[i] + " coordinates";
    lines = [EL("Plotted directly from the current triangle geometry — not derived from a formula."),
             BOXED(V(names[i], names[i]) + " = (" + NC2(dp(vx), names[i]) + ", " + NC2(dp(vy), names[i]) + ")")];
    approxS = coordSymbolic(vx, vy);
    exactS  = coordDecimal(vx, vy);
  } else if (id === "cen" || id === "inc" || id === "cir" || id === "ort") {
    const pt = info.get(D);
    const ncp = (inches, letter) => ncpFmt(inches, U, letter);
    const [pA, pB, pC] = S.P;
    const ptHl = { kind: "point", which: { cen: "centroid", inc: "incenter", cir: "circum", ort: "ortho" }[id] };
    const NC = inches => NCH(inches, ptHl);
    const m = {
      cen: ["Centroid", [
        EL("Average of the three vertices: " + FR(V("A", "A") + " + " + V("B", "B") + " + " + V("C", "C"), "3")),
        EL("Centroid = (" + FR(ncp(pA.x, "A") + " + " + ncp(pB.x, "B") + " + " + ncp(pC.x, "C"), "3") + ", " +
                             FR(ncp(pA.y, "A") + " + " + ncp(pB.y, "B") + " + " + ncp(pC.y, "C"), "3") + ")"),
        BOXED("Centroid = (" + NC(pt.x) + ", " + NC(pt.y) + ")")
      ]],
      inc: ["Incenter", [
        EL("A weighted average of the three vertices' coordinates — each vertex weighted by the length of the side directly opposite it (" + V("a", "a") + " is opposite " + V("A", "A") + ", " + V("b", "b") + " opposite " + V("B", "B") + ", " + V("c", "c") + " opposite " + V("C", "C") + "):"),
        EL(FR(V("a", "a") + "·" + V("A", "A") + " + " + V("b", "b") + "·" + V("B", "B") + " + " + V("c", "c") + "·" + V("C", "C"), V("a", "a") + " + " + V("b", "b") + " + " + V("c", "c"))),
        EL(NS("Incenter", "x") + " = " + FR(NLc(D.a, "a") + " · " + ncp(pA.x, "A") + " + " + NLc(D.b, "b") + " · " + ncp(pB.x, "B") + " + " + NLc(D.c, "c") + " · " + ncp(pC.x, "C"),
                                 NLc(D.a, "a") + " + " + NLc(D.b, "b") + " + " + NLc(D.c, "c"))),
        EL(NS("Incenter", "y") + " = " + FR(NLc(D.a, "a") + " · " + ncp(pA.y, "A") + " + " + NLc(D.b, "b") + " · " + ncp(pB.y, "B") + " + " + NLc(D.c, "c") + " · " + ncp(pC.y, "C"),
                                 NLc(D.a, "a") + " + " + NLc(D.b, "b") + " + " + NLc(D.c, "c"))),
        BOXED("Incenter = (" + NC(pt.x) + ", " + NC(pt.y) + ")")
      ]],
      cir: ["Circumcenter", [
        EL("Equidistant from all three vertices; the intersection of the perpendicular bisectors of the sides."),
        EL("|Circumcenter − " + V("A", "A") + "| = |Circumcenter − " + V("B", "B") + "| = |Circumcenter − " + V("C", "C") + "| = " + V("R", "R")),
        EL("|Circumcenter − " + V("A", "A") + "| = " + NLc(dist(pt, pA), "A") + "&nbsp;&nbsp;&nbsp;|Circumcenter − " + V("B", "B") + "| = " + NLc(dist(pt, pB), "B") + "&nbsp;&nbsp;&nbsp;|Circumcenter − " + V("C", "C") + "| = " + NLc(dist(pt, pC), "C")),
        BOXED("Circumcenter = (" + NC(pt.x) + ", " + NC(pt.y) + ")")
      ]],
      ort: ["Orthocenter", [
        EL("Intersection of the three altitudes — equivalently, Orthocenter = " + V("A", "A") + " + " + V("B", "B") + " + " + V("C", "C") + " − 2 · Circumcenter."),
        EL(NS("Orthocenter", "x") + " = " + ncp(pA.x, "A") + " + " + ncp(pB.x, "B") + " + " + ncp(pC.x, "C") + " − 2 · " + ncp(D.circum.x, "R")),
        EL(NS("Orthocenter", "y") + " = " + ncp(pA.y, "A") + " + " + ncp(pB.y, "B") + " + " + ncp(pC.y, "C") + " − 2 · " + ncp(D.circum.y, "R")),
        BOXED("Orthocenter = (" + NC(pt.x) + ", " + NC(pt.y) + ")")
      ]]
    }[id];
    title = m[0]; lines = m[1];
    approxS = coordSymbolic(pt.x / LEN[U].f, pt.y / LEN[U].f);
    exactS  = coordDecimal(pt.x / LEN[U].f, pt.y / LEN[U].f);
  } else { title = id; lines = []; approxS = null; exactS = "—"; }

  if (live) paintModalContent(title, bigv(title, approxS, exactS) + EQN(lines));
  else openModal(title, bigv(title, approxS, exactS) + EQN(lines));
}

/* SOH-CAH-TOA fraction each function is defined by, in terms of the
   opposite/adjacent/hypotenuse of the right triangle formed by dropping
   a perpendicular from one adjacent vertex onto the other adjacent side */
const TRIG_DEF = {
  sin: ["opposite", "hypotenuse"], cos: ["adjacent", "hypotenuse"], tan: ["opposite", "adjacent"],
  csc: ["hypotenuse", "opposite"], sec: ["hypotenuse", "adjacent"], cot: ["adjacent", "opposite"]
};

function openTrigExplain(fn, live) {
  const D = derive();
  const U = S.lenUnit;
  const names = ["A", "B", "C"], lname = ["a", "b", "c"];

  /* same values and same formatter the sidebar table uses (trigData /
     trigRatio / trigSafe) — so the two can never disagree */
  const tri = trigData(D);
  const tfmt = v => trigSafe(v, true); /* derivation lines are always the decimal; the Approximate box carries the fraction */
  const f = LEN[U].f, sym = LEN[U].sym;

  /* Every number is shown at the Decimals setting — except where the
     arithmetic, redone by hand from exactly what's printed, wouldn't come
     out to the printed result. Then (and only then) that line gets the
     extra decimal(s) it needs, so no step on screen is ever "off by one". */
  const r = (v, n) => +v.toFixed(n);
  function digitsFor(test) { for (let n = S.prec; n <= 15; n++) if (test(n)) return n; return 15; }
  const withFrac = (txt, v, unit) => { const fr = fractionStr(v); return txt + (fr ? " (" + fr + (unit ? " " + unit : "") + ")" : ""); };
  const lenT = (inches, n) => withFrac(fmt(inches / f, n) + " " + sym, inches / f, sym);

  const rv = rightVertex(D);
  const lines = [];
  if (rv >= 0) {
    const [numWord, denWord] = TRIG_DEF[fn];
    lines.push(EL(fn + " = " + FR(numWord, denWord)));
    lines.push(NOTE("This is a right triangle (the right angle is at " + V(names[rv], names[rv]) + "), so SOH-CAH-TOA applies directly to its own sides: the hypotenuse is " + V(lname[rv], lname[rv]) + ", the side across from the right angle. For each other angle, “opposite” is the side across from it and “adjacent” is the remaining leg."));
  } else {
    lines.push(NOTE("This triangle has no right angle, so SOH-CAH-TOA does not apply — there is no hypotenuse. The two laws that hold for EVERY triangle give the values from its real sides instead: the Law of Sines, a ÷ sin A = b ÷ sin B = c ÷ sin C = 2R (R = circumradius), so sin A = a ÷ (2R); and the Law of Cosines, cos A = (b² + c² − a²) ÷ (2·b·c). tan, csc, sec and cot then follow from their definitions: tan = sin ÷ cos, csc = 1 ÷ sin, sec = 1 ÷ cos, cot = cos ÷ sin."));
  }

  names.forEach((nm, i) => {
    const t = tri[i];
    const ratio = trigRatio(t, fn), shown = tfmt(ratio);
    const ratioFrac = isFinite(ratio) && Math.abs(ratio) < 1e7 ? fractionStr(ratio) : null;
    const answer = hl => NH(shown + (ratioFrac ? " (" + ratioFrac + ")" : ""), hl);

    if (t.mode === "right") {
      /* the right angle itself: its two sides are both legs, so there's
         no opposite/adjacent pair — the values are the definitions */
      const why = { sin: "= 1", cos: "= 0", tan: "is undefined (it would divide by cos 90° = 0)", csc: "= 1", sec: "is undefined (it would divide by cos 90° = 0)", cot: "= 0" }[fn];
      lines.push(NOTE(V(nm, nm) + " is the right angle itself, so it has no opposite/adjacent pair; by definition " + fn + " 90° " + why + "."));
      lines.push(BOXED(fn + "(" + V(nm, nm) + ") = " + answer({ kind: "vertex", i })));
      return;
    }

    if (t.mode === "sides") {
      /* SOH-CAH-TOA on real sides: each keeps its side color and a click
         highlights that side */
      const [numWord, denWord] = TRIG_DEF[fn];
      const num = t[numWord], den = t[denWord];
      const n = digitsFor(n => tfmt(r(num / f, n) / r(den / f, n)) === shown);
      const leg = word => NC2(lenT(t[word], n), lname[t.sideOf[word]]);
      lines.push(BOXED(fn + "(" + V(nm, nm) + ") = " + FR(V(numWord, lname[t.sideOf[numWord]]), V(denWord, lname[t.sideOf[denWord]])) +
        " = " + FR(leg(numWord), leg(denWord)) + " = " + answer({ kind: "all" })));
      return;
    }

    /* general triangle — Law of Sines for sin, Law of Cosines for cos,
       and the definitions for the rest. p, q = the two sides meeting at
       this angle; o = the side across from it. */
    const j = (i + 1) % 3, k = (i + 2) % 3;
    const p = lname[j], q = lname[k], o = lname[i];
    const L = lawLines(D, i), sv = L.sin, cv_ = L.cos, sinLine = L.sinLine, cosLine = L.cosLine;
    const vHl = { kind: "vertex", i };
    const tf = (v, n) => trigSafe(v, true, n);
    const nm2 = V(nm, nm);

    /* an obtuse angle's cos/tan/sec/cot are negative — say where that
       comes from, since nothing else on screen is negative */
    if (D.ang[i] > Math.PI / 2 && fn !== "sin" && fn !== "csc") {
      lines.push(NOTE(nm2 + " is obtuse, so the side across from it is long enough that " + V(o + "²", o) + " > " + V(p + "²", p) + " + " + V(q + "²", q) +
        ": the top of the Law of Cosines is negative, so cos(" + nm2 + ") is negative" +
        (fn === "cos" ? "." : ", and so is " + fn + "(" + nm2 + "), which divides by or into it.")));
    }

    if (fn === "sin") { lines.push(BOXED(sinLine(S.prec, answer(vHl)))); return; }
    if (fn === "cos") { lines.push(BOXED(cosLine(S.prec, answer(vHl)))); return; }

    /* tan, csc, sec, cot: from sin and cos by definition. sin/cos are
       shown at however many decimals make the final division, redone by
       hand, print as the answer. */
    const needS = fn !== "sec", needC = fn !== "csc";
    const quot = { tan: (s, c) => s / c, csc: s => 1 / s, sec: (s, c) => 1 / c, cot: (s, c) => c / s }[fn];
    let n = 15;
    for (let d = S.prec; d <= 15; d++) if (tf(quot(r(sv, d), r(cv_, d)), S.prec) === shown) { n = d; break; }
    if (needS) lines.push(EL(sinLine(n)));
    if (needC) lines.push(EL(cosLine(n)));
    const sN = NH(tf(sv, n), vHl), cN = NH(tf(cv_, n), vHl);
    const sym2 = { tan: FR("sin(" + nm2 + ")", "cos(" + nm2 + ")"), csc: FR("1", "sin(" + nm2 + ")"),
                   sec: FR("1", "cos(" + nm2 + ")"), cot: FR("cos(" + nm2 + ")", "sin(" + nm2 + ")") }[fn];
    const num2 = { tan: FR(sN, cN), csc: FR("1", sN), sec: FR("1", cN), cot: FR(cN, sN) }[fn];
    lines.push(BOXED(fn + "(" + nm2 + ") = " + sym2 + " = " + num2 + " = " + answer(vHl)));
  });

  const ratios = [0, 1, 2].map(i => trigRatio(tri[i], fn));
  /* a ratio only gets a fraction form where one genuinely exists (a
     3-4-5 triangle's 0.6, 0.8, 0.75 …) — the other letters just repeat
     their own decimal so the two rows still line up */
  const fracs = ratios.map(v => (isFinite(v) && Math.abs(v) < 1e7) ? fractionStr(v) : null);
  const exactS = names.map((nm, i) => V(nm, nm) + ": " + tfmt(ratios[i])).join("&nbsp;&nbsp;&nbsp;");
  const approxS = fracs.some(fr => fr)
    ? names.map((nm, i) => V(nm, nm) + ": " + (fracs[i] || tfmt(ratios[i]))).join("&nbsp;&nbsp;&nbsp;")
    : null;

  const title = fn.toUpperCase() + " of each angle";
  if (live) {
    paintModalContent(title, bigv(fn, approxS, exactS) + EQN(lines));
  } else {
    openModal(title, bigv(fn, approxS, exactS) + EQN(lines));
    S.activeExplain = { kind: "trig", fn };
    S.highlight = { kind: "all" }; requestRender();
  }
}

/* =======================================================================
   Render loop
   ======================================================================= */
let pending = false;
/* each stage runs in its own try/catch: an exception thrown while, say,
   laying out the pills must never be able to freeze the pills forever —
   every other stage (and every later frame) still has to run. */
function safeStep(name, fn) {
  try { fn(); } catch (err) { console.error("render step '" + name + "' failed:", err); }
}
function requestRender() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { if (pending) renderNow(); });
}
function renderNow() {
  {
    pending = false;
    let D = null;
    safeStep("derive", () => { D = derive(); });
    if (!D) return; /* nothing downstream can run without geometry */
    safeStep("draw", () => draw(D));
    /* pills keep tracking the triangle while they fade out into view-only
       (the canvas is resizing under them as the sidebar slides shut) */
    if (!S.viewOnly || S.viewFade < 1) safeStep("layoutPills", () => layoutPills(D));
    if (!S.viewOnly) {
      safeStep("updateStats", () => updateStats(D));
      /* applySearchFilter deliberately isn't run here — it depends only
         on the search box text and the (static) row labels, neither of
         which changes when the triangle does. It already has its own
         "input" listener; running the full multi-querySelectorAll sweep
         over every row on every single animation frame during a drag,
         for a result that could not possibly have changed, was pure
         waste stacked on top of everything else in this loop. */
    }
    safeStep("zoomtag", () => {
      const f = LEN[S.lenUnit].f, g = gridStep();
      const zt = document.getElementById("zoomtag");
      if (zt) zt.innerHTML = Math.round(S.view.z / 74 * 100) + "%  ·  grid " + trim(g / f) + " " + LEN[S.lenUnit].sym +
        " <span style='opacity:.6'>(" + trim(g / LEN[altLenUnit(g, S.lenUnit)].f) + " " + LEN[altLenUnit(g, S.lenUnit)].sym + ")</span>";
    });
    /* the explanation panel, if one is open, tracks the triangle live —
       dragging a handle or typing a new value updates its numbers in
       place, same as everything else on screen */
    if (S.activeExplain) safeStep("refreshActiveExplain", () => {
      const a = S.activeExplain;
      if (a.kind === "stat") openExplain(a.id, true);
      else if (a.kind === "trig") openTrigExplain(a.fn, true);
    });
  }
}

/* =======================================================================
   Hit testing
   ======================================================================= */
function distToSeg(p, u, w) {
  const vx = w.x - u.x, vy = w.y - u.y;
  const L2 = vx * vx + vy * vy;
  let t = L2 === 0 ? 0 : ((p.x - u.x) * vx + (p.y - u.y) * vy) / L2;
  t = clamp(t, 0, 1);
  return { d: Math.hypot(p.x - (u.x + t * vx), p.y - (u.y + t * vy)), t };
}
function pointInTri(p, q) {
  const s = (a, b, c) => (a.x - c.x) * (b.y - c.y) - (b.x - c.x) * (a.y - c.y);
  const d1 = s(p, q[0], q[1]), d2 = s(p, q[1], q[2]), d3 = s(p, q[2], q[0]);
  return !(((d1 < 0) || (d2 < 0) || (d3 < 0)) && ((d1 > 0) || (d2 > 0) || (d3 > 0)));
}
function hitTest(m) {
  const p = S.P.map(toScreen);
  for (let i = 0; i < 3; i++) if (Math.hypot(m.x - p[i].x, m.y - p[i].y) <= 15) return { kind: "vertex", i };
  for (let i = 0; i < 3; i++) {
    const r = distToSeg(m, p[(i + 1) % 3], p[(i + 2) % 3]);
    if (r.d <= 11 && r.t > 0.15 && r.t < 0.85) return { kind: "side", i };
  }
  if (pointInTri(m, p)) return { kind: "body", i: -1 };
  return null;
}

/* =======================================================================
   Interaction — drag vertices/sides/body, pan, zoom, multi-select, snap
   ======================================================================= */
/* getBoundingClientRect is a layout-forcing read too, and mouseAt runs on
   every single pointermove — cached and only refreshed by resize()
   (called on every window resize and on every sidebar/panel toggle,
   the only things that can actually move the canvas), instead of once
   per mouse event during a drag. */
let cvRectCache = null;
function invalidateCvRect() { cvRectCache = null; }
const mouseAt = e => {
  if (!cvRectCache) cvRectCache = cv.getBoundingClientRect();
  return { x: e.clientX - cvRectCache.left, y: e.clientY - cvRectCache.top };
};

cv.addEventListener("contextmenu", e => e.preventDefault());

cv.addEventListener("pointerdown", e => {
  if (S.viewOnly) return;
  const m = mouseAt(e);
  cancelCam(); cancelShapeAnim();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}

  if (e.button === 2 || e.button === 1 || (e.altKey && !e.shiftKey)) {
    S.drag = { mode: "pan", last: m }; cv.style.cursor = "grabbing"; return;
  }
  if (e.button !== 0) return;

  const hit = hitTest(m);

  if (hit && hit.kind === "vertex" && e.shiftKey) {
    const wasSelected = S.selected.has(hit.i);
    if (!wasSelected) S.selected.add(hit.i);
    if (S.selected.size >= 2) {
      /* group of 2+: a plain click (no movement) toggles membership off;
         any real drag rigidly translates the whole selection instead of
         re-solving constraints, which is what keeps a multi-drag free
         while a lone vertex still gets the precise constrained solve. */
      S.drag = { mode: "multi", startWorld: toWorld(m), startP: S.P.map(v => ({ x: v.x, y: v.y })),
                 idx: [...S.selected], clickVertex: hit.i, wasSelected, moved: false };
      cv.style.cursor = "grabbing";
    } else {
      S.drag = { mode: "vertex", i: hit.i, startWorld: toWorld(m), startP: S.P.map(v => ({ x: v.x, y: v.y })), shift: true };
      cv.style.cursor = "grabbing";
    }
    requestRender();
    return;
  }
  if (!hit) { S.drag = { mode: "pan", last: m }; cv.style.cursor = "grabbing"; return; }
  if (hit.kind !== "vertex" || !S.selected.has(hit.i)) S.selected.clear();

  S.drag = { mode: hit.kind, i: hit.i, startWorld: toWorld(m), startP: S.P.map(v => ({ x: v.x, y: v.y })), shift: e.shiftKey };
  cv.style.cursor = "grabbing";
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
});

function snapPoint(w) {
  const grid = gridStep();
  const nearestX = Math.round(w.x / grid) * grid, nearestY = Math.round(w.y / grid) * grid;
  const px = sx(w.x), py = sy(w.y);
  const npx = sx(nearestX), npy = sy(nearestY);
  const d = Math.hypot(px - npx, py - npy);
  return d < 16 ? { x: nearestX, y: nearestY, snapped: true } : { x: w.x, y: w.y, snapped: false };
}

cv.addEventListener("pointermove", e => {
  if (S.viewOnly) return;
  const m = mouseAt(e);
  const dg = S.drag;

  if (!dg) {
    const h = hitTest(m);
    const changed = JSON.stringify(h) !== JSON.stringify(S.hover);
    S.hover = h;
    cv.style.cursor = !h ? "default" : h.kind === "body" ? "grab" : "move";
    if (changed) requestRender();
    return;
  }

  if (dg.mode === "pan") {
    S.view.cx -= (m.x - dg.last.x) / S.view.z;
    S.view.cy += (m.y - dg.last.y) / S.view.z;
    dg.last = m;
    requestRender();
    return;
  }

  const w = toWorld(m);
  const dx = w.x - dg.startWorld.x, dy = w.y - dg.startWorld.y;

  if (dg.mode === "multi") {
    if (Math.hypot(dx, dy) > 1e-4) dg.moved = true;
    const p2 = dg.startP.map((v, idx) => dg.idx.includes(idx) ? { x: v.x + dx, y: v.y + dy } : { x: v.x, y: v.y });
    /* moving all three is a rigid translation — nothing to solve. Moving
       two of three reshapes the triangle, so any active side/angle lock
       has to be re-satisfied, exactly like a single-vertex drag (this
       used to move them freely and silently break the locks) */
    if (dg.idx.length < 3 && anyLockActive()) {
      const wts = [1, 1, 1]; dg.idx.forEach(v => { wts[v] = 0.35; });
      applyConstraints(p2, wts, null, true);
    } else S.P = p2;
    requestRender();
    return;
  }

  if (dg.mode === "vertex" || dg.mode === "side") {
    /* the LM solve behind applyConstraints is the expensive part of a
       drag, and pointermove can fire far faster than the screen repaints
       (well over 60/sec on some mice/trackpads) — solving on every single
       one queues up more work than the frame budget allows and shows up
       as the drag lagging behind the cursor. Coalescing to one solve per
       animation frame (like requestRender already does for painting)
       keeps it exactly as responsive as the display's own refresh rate. */
    dg.liveDX = dx; dg.liveDY = dy;
    dg.liveSnap = null;
    if (dg.mode === "vertex" && e.shiftKey) {
      /* snap the CANDIDATE VERTEX position itself, not the mouse — if the
         vertex was grabbed a few pixels off its own center (well within
         the hit-test tolerance), snapping the mouse's world position and
         then re-adding that same offset would land the vertex slightly
         off the grid line, not exactly on it */
      const cand = { x: dg.startP[dg.i].x + dx, y: dg.startP[dg.i].y + dy };
      const sp = snapPoint(cand);
      if (sp.snapped) dg.liveSnap = { x: sp.x, y: sp.y };
    }
    if (!dg.solvePending) {
      dg.solvePending = true;
      requestAnimationFrame(() => {
        dg.solvePending = false;
        if (S.drag !== dg) return; /* drag ended or a new one started before this frame ran */
        const p2 = dg.startP.map(v => ({ x: v.x, y: v.y }));
        if (dg.mode === "vertex") {
          if (dg.liveSnap) {
            /* an explicit snap target must land EXACTLY there regardless
               of any active lock — pin it outright instead of just
               weighting toward it (see alignPinned) */
            p2[dg.i] = { x: dg.liveSnap.x, y: dg.liveSnap.y };
            applyConstraints(p2, null, null, true, dg.i);
          } else {
            p2[dg.i] = { x: dg.startP[dg.i].x + dg.liveDX, y: dg.startP[dg.i].y + dg.liveDY };
            const wts = [1, 1, 1]; wts[dg.i] = 0.25;
            applyConstraints(p2, wts, null, true);
          }
        } else {
          const j = (dg.i + 1) % 3, k = (dg.i + 2) % 3;
          p2[j] = { x: dg.startP[j].x + dg.liveDX, y: dg.startP[j].y + dg.liveDY };
          p2[k] = { x: dg.startP[k].x + dg.liveDX, y: dg.startP[k].y + dg.liveDY };
          const wts = [1, 1, 1]; wts[j] = 0.35; wts[k] = 0.35;
          applyConstraints(p2, wts, null, true);
        }
        requestRender();
      });
    }
    return;
  } else if (dg.mode === "body") {
    S.P = dg.startP.map(v => ({ x: v.x + dx, y: v.y + dy }));
  }
  requestRender();
});

function endDrag(e) {
  if (!S.drag) return;
  const dg = S.drag;
  const wasGeometry = dg.mode !== "pan";
  if (dg.mode === "multi" && dg.idx.length < 3 && anyLockActive()) applyConstraints(S.P, [1, 1, 1], null, false);
  if (dg.mode === "vertex" || dg.mode === "side") {
    /* final high-accuracy solve — still pinned if the drag ended while
       snapped, so this cleanup pass can't nudge the vertex back off the
       grid point it just landed on */
    applyConstraints(S.P, [1, 1, 1], null, false, dg.mode === "vertex" && dg.liveSnap ? dg.i : undefined);
  }
  if (dg.mode === "multi" && !dg.moved && dg.wasSelected) S.selected.delete(dg.clickVertex);
  S.drag = null;
  cv.style.cursor = "default";
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
  if (wasGeometry) pushHistory();
  requestRender();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("pointerleave", () => { if (!S.drag) { S.hover = null; requestRender(); } });

cv.addEventListener("wheel", e => {
  if (S.viewOnly) return;
  e.preventDefault();
  const m = mouseAt(e);
  /* wheel notches accumulate into a TARGET zoom; the view then eases
     toward it every frame (exponential smoothing in log-space) instead of
     jumping a whole notch at once. The world point under the cursor is
     re-pinned under the cursor on every frame, so it stays put the
     whole way even if the cursor moves mid-glide. */
  const fromZ = zoomGlide ? zoomGlide.target : S.view.z;
  if (camAnim !== null) cancelCam();
  const target = clamp(fromZ * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.02 : 0.0016)), 1e-6, 1e9);
  const anchor = toWorld(m);
  if (zoomGlide) { zoomGlide.target = target; zoomGlide.m = m; zoomGlide.w = anchor; return; }
  zoomGlide = { target, m, w: anchor, raf: 0, last: performance.now() };
  const step = now => {
    const g = zoomGlide;
    if (!g) return;
    const dt = Math.min(64, now - g.last); g.last = now;
    const k = 1 - Math.exp(-dt / 55); /* ~55ms time constant, frame-rate independent */
    const lz = Math.log(S.view.z), lt = Math.log(g.target);
    const done = Math.abs(lt - lz) < 1e-4;
    S.view.z = done ? g.target : Math.exp(lz + (lt - lz) * k);
    S.view.cx = g.w.x - (g.m.x - W / 2) / S.view.z;
    S.view.cy = g.w.y - (HH / 2 - g.m.y) / S.view.z;
    renderNow();
    if (done) zoomGlide = null; else g.raf = requestAnimationFrame(step);
  };
  zoomGlide.raf = requestAnimationFrame(step);
}, { passive: false });

/* =======================================================================
   Shape transform buttons — rotate / flip / scale, all animated smoothly
   (the triangle is repositioned by dragging its body directly; there's
   no separate "move" control)
   ======================================================================= */
let shapeAnim = null;
function cancelShapeAnim() { if (shapeAnim !== null) { cancelAnimationFrame(shapeAnim); shapeAnim = null; } }

/* paramFn(e) returns the interpolated point set for eased progress e∈[0,1] */
function animateShapeTransform(paramFn, ms) {
  cancelShapeAnim(); cancelCam();
  const dur = ms === undefined ? 450 : ms;
  const t0 = performance.now();
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const step = now => {
    const t = clamp((now - t0) / dur, 0, 1);
    S.P = paramFn(ease(t));
    requestRender();
    if (t < 1) { shapeAnim = requestAnimationFrame(step); }
    else { shapeAnim = null; animateView(fitTarget(), 380); pushHistory(); }
  };
  shapeAnim = requestAnimationFrame(step);
}
function rotateBy(a) {
  const c = derive().centroid;
  const start = S.P.map(v => ({ x: v.x, y: v.y }));
  animateShapeTransform(e => {
    const ang = a * e, cs = Math.cos(ang), sn = Math.sin(ang);
    return start.map(p => { const x = p.x - c.x, y = p.y - c.y; return { x: c.x + x * cs - y * sn, y: c.y + x * sn + y * cs }; });
  }, 420);
}
function flip(axis) {
  const c = derive().centroid;
  const start = S.P.map(v => ({ x: v.x, y: v.y }));
  animateShapeTransform(e => {
    /* the mirror factor sweeps 1 → -1 through 0, so the triangle
       visibly compresses to a line and unfolds mirrored — reads as a
       smooth flip rather than an instant, jarring swap */
    const f = 1 - 2 * e;
    return start.map(p => axis === "h" ? { x: c.x + (p.x - c.x) * f, y: p.y } : { x: p.x, y: c.y + (p.y - c.y) * f });
  }, 420);
}
function scaleBy(factor) {
  const c = derive().centroid;
  const start = S.P.map(v => ({ x: v.x, y: v.y }));
  /* scaling is a similarity: every length × factor, every angle unchanged.
     Pressing scale is an explicit request to change the size, so a locked
     side's target scales along with it (angle locks need nothing) —
     otherwise the lock would be left permanently in conflict */
  const startTargets = S.target.side.slice();
  animateShapeTransform(e => {
    const f = 1 + (factor - 1) * e;
    for (let i = 0; i < 3; i++) if (S.lock.side[i]) S.target.side[i] = startTargets[i] * f;
    return start.map(p => ({ x: c.x + (p.x - c.x) * f, y: c.y + (p.y - c.y) * f }));
  }, 380);
}

/* small floating menu used for unit pickers */
let openMenuEl = null;
function closeMenu() { if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; document.removeEventListener("pointerdown", menuOutside, true); } }
function menuOutside(e) { if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu(); }
function openMenu(anchor, items) {
  closeMenu();
  const el = document.createElement("div");
  el.className = "menu";
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "menu-item" + (it.on ? " on" : "");
    d.innerHTML = "<span>" + it.label + "</span>" + (it.on ? "<i class='fa-solid fa-check' style='font-size:10px'></i>" : "");
    d.addEventListener("click", () => { closeMenu(); it.click(); });

  });
  document.body.appendChild(el);

  if (left + el.offsetWidth > window.innerWidth - 8) left = window.innerWidth - el.offsetWidth - 8;

  setTimeout(() => document.addEventListener("pointerdown", menuOutside, true), 0);

/* entering/leaving view-only is animated end to end: the toolbar, pills
   and hints fade (CSS), the sidebar and any open explanation panel slide
   shut/open (so the canvas resizes smoothly into the freed space instead
   of snapping), and the canvas cross-fades from the annotated drawing to
   the plain outline (S.viewFade). Leaving restores exactly what was open
   before — sidebar and panel alike. */
let viewFadeAnim = null, viewRestore = null;
function setViewOnly(on) {
  if (on === S.viewOnly) return;
  S.viewOnly = on;
  document.body.classList.toggle("view-only", on);
  closeMenu();

  if (on) {
    viewRestore = {
      sidebar: sidebarOpen,
      panelPx: modalRoot.classList.contains("show") ? modalRoot.getBoundingClientRect().height : 0
    };
    if (sidebarOpen) setSidebarOpen(false);
    if (viewRestore.panelPx > 0) setPanelOpen(false, 0, 280, true);
  } else if (viewRestore) {
    if (viewRestore.sidebar && !sidebarOpen) setSidebarOpen(true);
    if (viewRestore.panelPx > 0 && modalRoot.classList.contains("show")) setPanelOpen(true, viewRestore.panelPx, 280, true);
    viewRestore = null;
  }

  if (viewFadeAnim) cancelAnimationFrame(viewFadeAnim);
  const from = S.viewFade, to = on ? 1 : 0, t0 = performance.now(), dur = 320;
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const step = now => {
    const t = clamp((now - t0) / dur, 0, 1);
    S.viewFade = from + (to - from) * ease(t);

  };

  syncChrome(); requestRender();
}

      sidebarEl.style.display = open ? "" : "none";

  });
  document.getElementById("mResetColors").addEventListener("click", () => {
    COLOR_VARS.forEach(([v]) => document.documentElement.style.removeProperty(v));
    invalidateThemeColors(); requestRender();
    closeModal();
  });
});

/* =======================================================================
   Search
   ======================================================================= */
function applySearchFilter() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  document.querySelectorAll(".sec").forEach(sec => {
    const body = sec.querySelector(".sec-body");
    const title = sec.querySelector(".sec-head span").textContent.toLowerCase();
    if (!q) { sec.classList.remove("searchhide"); body.querySelectorAll(".row").forEach(r => r.classList.remove("rowhide")); return; }
    let any = title.includes(q);
    body.querySelectorAll(".row").forEach(r => {
      const t = r.querySelector(".k") ? r.querySelector(".k").textContent.toLowerCase() : "";
      const hit = t.includes(q) || title.includes(q);
      r.classList.toggle("rowhide", !hit);
      if (hit) any = true;
    });
    body.querySelectorAll(".trow").forEach(r => { if (title.includes(q)) any = true; });
    sec.classList.toggle("searchhide", !any);
    if (any && q && sec.classList.contains("collapsed")) {
      sec.classList.remove("collapsed");
      sec.querySelector(".sec-collapse").style.maxHeight = "2000px";
    }
  });
}
document.getElementById("searchBox").addEventListener("input", applySearchFilter);

/* =======================================================================
   Keyboard
   ======================================================================= */
window.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    if (key === "z" && !e.shiftKey) { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); undo(); return; }
    if (key === "y" || (key === "z" && e.shiftKey)) { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); redo(); return; }
    return;
  }
  if (key === "escape") { closeModal(); closeMenu(); S.selected.clear(); requestRender(); return; }
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (key === "f") fitView();
  else if (key === "g") document.getElementById("btnGrid").click();
  else if (key === "r") document.getElementById("btnReset").click();
  else if (key === "u") document.getElementById("btnClear").click();
  else if (key === "d") document.getElementById("btnAng").click();
  else if (key === "l") document.getElementById("btnLen").click();
  else if (key === "b") document.getElementById("navtoggle").click();
  else if (key === "v") document.getElementById("btnView").click();
});

/* boot */
if (window.innerWidth < 900) { sidebarOpen = false; sidebarEl.style.display = "none"; }
syncChrome();
resize();
markLoaded();
requestRender();
</script>
