<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Triangle Thing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#0b0b0d; --header:#101013; --footer:#101013;
  --panel:#0f0f12; --panel-2:#131317; --pill:#111115;
  --line:#232328; --line-2:#2e2e35;
  --txt:#f2f2f4; --txt-2:#a0a0aa; --txt-3:#6a6a74;
  --accent:#ffffff; --accent-ink:#0b0b0d;
  /* palette restricted to grayscale + the three primaries (red / green / blue) */
  --red:#ff5c5c; --red-dim:#ff8a8a; --green:#46d160; --green-dim:#7ee08a; --blue:#4ea1ff; --blue-dim:#7fb8ff;
  --lock:var(--red); --lock-ink:#2a0d0d;
  --ease:cubic-bezier(.32,.72,.28,1);
  --cat-0:rgba(255,92,92,.07); --cat-1:rgba(70,209,96,.07); --cat-2:rgba(78,161,255,.07);
  --cat-3:rgba(160,160,168,.08); --cat-4:rgba(70,209,96,.12); --cat-5:rgba(78,161,255,.12); --cat-6:rgba(160,160,168,.12);
}
:root[data-theme="light"]{
  --bg:#f4f4f6; --header:#ffffff; --footer:#ffffff;
  --panel:#ffffff; --panel-2:#f0f0f3; --pill:#ffffff;
  --line:#e4e4ea; --line-2:#d3d3db;
  --txt:#17171a; --txt-2:#5c5c66; --txt-3:#8c8c96;
  --accent:#17171a; --accent-ink:#ffffff;
  --red:#c22b2b; --red-dim:#d64545; --green:#158a37; --green-dim:#2f9e46; --blue:#1d4ed8; --blue-dim:#3b82f6;
  --lock:var(--red); --lock-ink:#2a0d0d;
  --cat-0:rgba(194,43,43,.06); --cat-1:rgba(21,138,55,.06); --cat-2:rgba(29,78,216,.06);
  --cat-3:rgba(110,110,120,.07); --cat-4:rgba(21,138,55,.1); --cat-5:rgba(29,78,216,.1); --cat-6:rgba(110,110,120,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);font-size:13px;font-weight:400;
  -webkit-font-smoothing:antialiased;user-select:none;
  display:flex;flex-direction:column;
}
input,button,select{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--panel)}

.tbtn,#navtoggle,.stepper button,.pill .lockbtn,.sec-head,.chip,.pill,.iconbtn,.menu-item,.row.clickable{
  transition:background-color .17s var(--ease),color .17s var(--ease),border-color .17s var(--ease),
             box-shadow .17s var(--ease),opacity .17s var(--ease),transform .12s var(--ease);
}
.tbtn:active:not([disabled]),#navtoggle:active,.stepper button:active,.pill .lockbtn:active,.iconbtn:active{transform:scale(.88)}
.tbtn:focus-visible,#navtoggle:focus-visible,.stepper button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--txt-3)}

/* ---------------- Header / Footer ---------------- */
#appHeader{
  flex:0 0 44px;height:44px;background:var(--header);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 14px;z-index:30;
}
#appHeader .mark{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:6px;font-size:9px;color:var(--txt-2)}
#appHeader h1{font-size:12.5px;font-weight:700;letter-spacing:.06em}
#appHeader .flexgap{flex:1}
#searchWrap{position:relative;width:220px}
#searchWrap i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--txt-3)}
#searchBox{
  width:100%;height:28px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;
  color:var(--txt);font-size:11.5px;padding:0 10px 0 26px;outline:0;
}
#searchBox:focus{border-color:var(--txt-3)}
#searchBox::placeholder{color:var(--txt-3)}
.iconbtn{
  width:28px;height:28px;background:transparent;border:1px solid transparent;border-radius:6px;
  color:var(--txt-2);cursor:pointer;font-size:12px;display:grid;place-items:center;
}
.iconbtn:hover{background:var(--panel-2);color:var(--txt);border-color:var(--line-2)}

#appFooter{
  flex:0 0 30px;height:30px;background:var(--footer);border-top:1px solid var(--line);
  display:flex;align-items:center;padding:0 14px;gap:16px;z-index:30;font-size:10.5px;color:var(--txt-3);
}
#appFooter .fgap{flex:1}
.foot-ico{display:flex;align-items:center;gap:6px}
.foot-ico i{font-size:11px;color:var(--txt-3)}

#appBody{flex:1;min-height:0;display:flex;overflow:hidden}

/* ---------------- Sidebar ---------------- */
#sidebar{
  width:352px;flex:0 0 352px;height:100%;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:24px}

.sec{border-bottom:1px solid var(--line);position:relative}
.sec::before{content:"";position:absolute;inset:0;background:var(--tint);pointer-events:none;z-index:0}
.sec.cat-0{--tint:var(--cat-0)} .sec.cat-1{--tint:var(--cat-1)} .sec.cat-2{--tint:var(--cat-2)}
.sec.cat-3{--tint:var(--cat-3)} .sec.cat-4{--tint:var(--cat-4)} .sec.cat-5{--tint:var(--cat-5)} .sec.cat-6{--tint:var(--cat-6)}
.sec-head,.sec-body{position:relative;z-index:1}
.sec-head{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;color:var(--txt-2)}
.sec-head:hover{background:rgba(128,128,128,.06)}
.sec-head i.ico{font-size:11px;width:13px;text-align:center;color:var(--txt-3)}
.sec-head span{flex:1;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.sec-head i.chev{font-size:9px;color:var(--txt-3);transition:transform .22s var(--ease)}
.sec.collapsed i.chev{transform:rotate(-90deg)}
/* collapse animates max-height, driven from JS with the section's real
   measured height (see toggleSection) — grid-template-rows transitions
   between fr tracks are unreliable across engines, so this is the
   version that actually animates smoothly everywhere */
.sec-collapse{overflow:hidden;max-height:2000px;transition:max-height .32s var(--ease)}
.sec-body{padding:2px 14px 12px;display:flex;flex-direction:column;gap:2px}
.sec.searchhide{display:none}

.card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}
.row{display:flex;align-items:baseline;gap:8px;padding:3.5px 2px;font-size:12px;border-radius:5px}
.row.withicon{align-items:center}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:rgba(128,128,128,.09)}
.row.rowhide{display:none}
.row .k{color:var(--txt-3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.01em;text-align:right;white-space:nowrap}
.row .v .alt{color:var(--txt-3);font-size:10.5px;font-weight:400;margin-left:3px}
.row .v.dim{color:var(--txt-2);font-weight:400}
.row.hl .v{color:var(--txt)}

.tblock{margin-top:4px}
.tblock .thdr{display:grid;grid-template-columns:1fr repeat(3,52px);gap:4px;padding:2px 2px 5px;border-bottom:1px solid var(--line);margin-bottom:3px}
.tblock .thdr span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3);font-weight:600;text-align:right}
.tblock .thdr span:first-child{text-align:left}
.trow{display:grid;grid-template-columns:1fr repeat(3,52px);gap:4px;padding:3px 2px;border-radius:5px;cursor:pointer}
.trow:hover{background:rgba(128,128,128,.09)}
.trow .fn{color:var(--txt-3);font-size:11px;text-align:left}
.trow .c{color:var(--txt);font-weight:500;font-size:11px;text-align:right;font-variant-numeric:tabular-nums}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;padding:3px 8px;border:1px solid var(--line-2);border-radius:20px;color:var(--txt-2)}
.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}

.side-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pf-group{display:flex;align-items:center;gap:6px}
.pf-lbl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3)}
.stepper{display:flex;align-items:center;gap:1px}
.stepper button{width:20px;height:20px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--txt-2);cursor:pointer;font-size:9px;display:grid;place-items:center}
.stepper button:first-child{border-radius:5px 0 0 5px}
.stepper button:last-child{border-radius:0 5px 5px 0}
.stepper button:hover{background:var(--line);color:var(--txt)}
.stepper .val{width:22px;height:20px;display:grid;place-items:center;background:var(--panel-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.toggle2{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.toggle2 button{height:22px;padding:0 8px;background:var(--panel-2);border:0;color:var(--txt-2);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.toggle2 button.on{background:var(--txt);color:var(--bg)}
.toggle2 button+button{border-left:1px solid var(--line-2)}

/* ---------------- Stage ---------------- */
#stage{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;pointer-events:none}
/* view-only fades the chrome out instead of display:none-ing it in one
   frame. visibility flips only AFTER the fade-out finishes (and at once
   on the way back in), so hidden controls can't be clicked or tabbed to,
   yet the fade itself is still visible. The sidebar and the explanation
   panel don't fade — they slide shut via JS (see setViewOnly), since
   they're real layout that the canvas has to resize into. */
#overlay,#toolbar,#navtoggle,#zoomtag{transition:opacity .3s var(--ease),visibility 0s linear 0s}
body.view-only #overlay,body.view-only #toolbar,body.view-only #navtoggle,body.view-only #zoomtag{
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility 0s linear .3s;
}
#appHeader,#appFooter{transition:opacity .35s var(--ease)}
body.view-only #appHeader,body.view-only #appFooter{opacity:.35}
body.view-only #viewport{cursor:default}
/* the only control left reachable in view-only mode: a way back out of it */
#exitViewOnly{
  position:absolute;top:12px;right:12px;z-index:6;display:flex;height:29px;padding:0 12px;align-items:center;gap:7px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:7px;color:var(--txt-2);cursor:pointer;font-size:11px;
  opacity:0;visibility:hidden;transform:translateY(-4px);
  transition:opacity .25s var(--ease),transform .25s var(--ease),visibility 0s linear .25s,background-color .17s var(--ease),color .17s var(--ease);
}
#exitViewOnly:hover{background:var(--panel-2);color:var(--txt)}
body.view-only #exitViewOnly{
  opacity:1;visibility:visible;transform:none;
  transition:opacity .3s var(--ease) .15s,transform .3s var(--ease) .15s,visibility 0s linear 0s,background-color .17s var(--ease),color .17s var(--ease);
}

/* ---------------- Pills ---------------- */
.pill{position:absolute;pointer-events:auto;display:flex;align-items:stretch;background:var(--pill);border:1px solid var(--line-2);border-radius:8px;transform:translate(-50%,-50%);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.pill:hover{border-color:var(--txt-3)}
.pill-body{display:flex;flex-direction:column;justify-content:center;padding:4px 0 5px;min-height:36px}
.pill-main{display:flex;align-items:center;height:16px}
.pill .tag{padding:0 5px 0 9px;font-size:10.5px;font-weight:600;color:var(--txt-3);font-style:italic;display:flex;align-items:center;height:100%}
.pill input{background:transparent;border:0;outline:0;color:var(--txt);font:500 12px 'Inter',sans-serif;letter-spacing:-.01em;padding:0;width:74px}
.pill-alt{padding:1px 9px 0 22px;font-size:10px;line-height:12px;color:var(--txt-3);white-space:nowrap}
.pill-coord{display:flex;gap:5px;padding:2px 9px 0 22px}
.pill-coord input{width:38px;font-size:10px;color:var(--txt-2);border-bottom:1px dashed var(--line-2)}
.pill-coord span{font-size:9px;color:var(--txt-3);align-self:center}
.pill .lockbtn{width:27px;background:transparent;border:0;border-left:1px solid var(--line-2);border-radius:0 7px 7px 0;color:var(--txt-3);cursor:pointer;font-size:10px;display:grid;place-items:center}
.pill .lockbtn:hover{background:var(--panel-2);color:var(--txt)}

/* the locked outline draws itself as two arcs that start at opposite
   corners (top-left, bottom-right) and race around to meet each other.
   Sized in real pixels every frame (viewBox == the pill's own box) so
   the rounded corners are true circles, matching the pill's own
   border-radius exactly — no stretched/oval corners, no stray sharp
   rectangle showing through the rounded one. */
/* the ring sits ON the pill's 1px border, not inside it: the svg is
   stretched over the whole border box (inset:-1px), and the stroke's
   outer edge is placed exactly on that box's edge (see RING). Drawn
   inside the border instead, the gray border stayed visible as a dark
   line all the way around the red. */
.lockring{position:absolute;top:-1px;left:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;overflow:visible}
.lockring rect{fill:none;stroke:var(--lock);stroke-width:2.25}
.lockring rect.draw{opacity:0}
.lockring rect.rot{transform-box:fill-box;transform-origin:center;transform:rotate(180deg)}

.pill.locked{box-shadow:0 4px 16px rgba(0,0,0,.35)}
/* ring fully drawn (not mid draw-in/undraw): the border underneath goes
   red as well, so no gray antialiasing fringe can show at the corners */
.pill.ring-full,.pill.ring-full:hover{border-color:var(--lock)}
.pill.locked .tag{color:var(--lock)}
.pill.locked .lockbtn{color:var(--lock);border-left-color:var(--lock)}
.pill.locked .lockbtn:hover{background:rgba(255,92,92,.15)}
.pill.conflict{border-style:dashed}
.pill .warn{display:none;padding:0 6px 0 2px;font-size:10px;color:var(--txt-2)}
.pill.conflict .warn{display:block;color:var(--lock)}
.pill.active{border-color:var(--txt)}
.pill.selected{box-shadow:0 0 0 2px var(--blue),0 4px 16px rgba(0,0,0,.35)}

/* ---------------- Toolbar ---------------- */
#toolbar{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
.tbtn{height:29px;min-width:29px;padding:0 8px;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;color:var(--txt-2);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px;opacity:.95}
.tbtn:hover:not([disabled]){background:var(--panel-2);color:var(--txt);border-color:var(--txt-3)}
.tbtn.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.tbtn.on:hover{opacity:.85}
.tbtn[disabled]{opacity:.3;cursor:default}
.tbtn .t{font-size:9.5px;font-weight:600;letter-spacing:.08em}
.tgroup{display:flex;gap:6px;background:rgba(128,128,128,.06);border:1px solid var(--line);border-radius:8px;padding:3px}

#navtoggle{position:absolute;top:12px;left:12px;z-index:5;height:29px;width:29px;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;color:var(--txt-2);cursor:pointer;font-size:11px;display:grid;place-items:center}
#navtoggle:hover{background:var(--panel-2);color:var(--txt)}

#cornerHints{position:absolute;right:12px;bottom:10px;z-index:4;display:flex;gap:10px;align-items:center;pointer-events:none}
#cornerHints .h{display:flex;align-items:center;gap:5px;color:var(--txt-3);font-size:10px;background:rgba(20,20,24,.001)}
#cornerHints i{font-size:12px}
#zoomtag{
  position:absolute;left:12px;bottom:10px;z-index:4;font-size:10.5px;color:var(--txt-2);font-variant-numeric:tabular-nums;pointer-events:none;
  background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:5px 10px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap;
}

/* ---------------- Explanation panel ---------------- */
/* a real docked panel — a flex child of #stage, not an overlay floating
   on top of the canvas. Opening it actually shrinks the viewport (the
   canvas resizes to make room), and its height is driven from JS
   (see setPanelOpen) so the resize happens smoothly, frame by frame,
   instead of the canvas snapping once the CSS transition finishes. */
.modal-backdrop{
  flex:0 0 auto;height:0;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--panel);border-top:1px solid var(--line-2);
  box-shadow:0 -8px 34px rgba(0,0,0,.35);
}
.modal{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.modal-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:13px;font-weight:600;flex:1}
.modal-body{overflow-y:auto;min-height:0}
.modal-body{padding:14px 16px;font-size:12.5px;line-height:1.7;color:var(--txt-2);user-select:text}
.modal-body .big{display:flex;gap:14px;margin-bottom:12px}
.modal-body .bigv{flex:1;position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.modal-body .bigv .lbl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);margin-bottom:3px}
.modal-body .bigv .num{font-size:15px;color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;padding-right:24px}
.modal-body p{margin-bottom:8px;color:var(--txt-2)}

/* readable, color-coded equations with real fraction bars */
.eqn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:13px 14px;font-size:14.5px}
.eqn-line{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;gap:0;min-height:30px;padding:8px 0;line-height:1.9;color:var(--txt-2)}
.eqn-line+.eqn-line{border-top:1px dashed var(--line)}
/* the actual formula/text content, as a single flex item — see the
   comment on EL/BOXED/NOTE for why this wrapper has to exist at all */
.eqn-line .eqn-content{flex:1 1 auto;min-width:0}
/* copy-to-clipboard, on every equation line and every big value */
.copy-btn{
  flex:0 0 auto;margin:0 0 0 auto;width:24px;height:22px;
  border:1px solid var(--line-2);background:var(--panel);border-radius:5px;
  color:var(--txt-3);cursor:pointer;font-size:10px;display:grid;place-items:center;
}
.copy-btn:hover{background:var(--panel-2);color:var(--txt);border-color:var(--txt-3)}
.copy-btn.copied{color:var(--green);border-color:var(--green)}
.copy-btn-bigv{position:absolute;top:7px;right:7px;margin:0;width:20px;height:20px;font-size:9px}
/* the line that states the final, fully-resolved answer gets its own box */
.eqn-line.eqn-final{
  margin:10px 0 2px;padding:10px 13px;border:1.5px solid var(--txt-2);border-radius:7px;
  background:rgba(128,128,128,.08);color:var(--txt);font-weight:600;
}
.eqn-line.eqn-final+.eqn-line{border-top:0}
/* a short aside explaining WHY a unit/representation conversion is
   happening right here (deg→rad, etc.) — reads as prose, not as a
   formula step, so it's set apart from the eqn-line rhythm around it */
.eqn-line.eqn-note{
  font-style:italic;font-size:.86em;line-height:1.5;color:var(--txt-3);
  padding:6px 0;min-height:0;gap:8px;
}
.eqn-line.eqn-note i{flex:0 0 auto;font-size:.95em;opacity:.8}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px;line-height:1.3;font-size:.92em}
.frac .num{border-bottom:1.4px solid var(--txt-3);padding:0 4px 2px;white-space:nowrap}
.frac .den{padding:2px 4px 0;white-space:nowrap}
.op{color:var(--txt-3);margin:0 2px}
.var{font-weight:700;padding:0 1px}
/* every colored variable or number points at something on the triangle
   when clicked — a slight lift on hover says so */
.eqn .var[class*="var-"],.eqn .numv[class*="var-"],.bigv .var[class*="var-"]{cursor:pointer;border-radius:3px}
.eqn .var[class*="var-"]:hover,.eqn .numv[class*="var-"]:hover,.bigv .var[class*="var-"]:hover{background:rgba(78,161,255,.22)}
/* uncolored values that still map to something drawable (an altitude's
   length, a trig construction's opposite/adjacent leg, a center point) */
.eqn .hlv{cursor:pointer;border-radius:3px;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--txt-3)}
.eqn .hlv:hover{background:rgba(78,161,255,.22)}
/* whatever value is currently lit up on the canvas */

<script>
"use strict";

/* =======================================================================
   Math utilities
   ======================================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
const deg = r => r * 180 / Math.PI;
const radOf = d => d * Math.PI / 180;

function fmt(v, d) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  if (!isFinite(v)) return "∞";
  const a = Math.abs(v);
  /* a nonzero value must never print as a plain run of zeros ("0.00"
     for 0.000001) — if it'd round away to nothing at this precision,
     scientific notation is the only honest way to show it */
  let s = v.toFixed(d);
  if (a !== 0 && (a >= 1e9 || a < 1e-6 || +s === 0)) return v.toExponential(Math.max(2, d - 1));
  if (s === "-" + (0).toFixed(d)) s = (0).toFixed(d);
  return s;
}
const trim = v => String(+v.toPrecision(6));
/* every displayed answer/derivation number: fixed at the Decimals setting
   (4 by default), so "3" reads "3.0000" and values line up column-wise */
const dp = v => fmt(v, S.prec);

/* "Exact" formatting: full precision, but trailing zeros are trimmed —
   a value that terminates cleanly (like the number 5) reads as "5.0",
   not as a wall of fake precision like "5.0000000000". */
function fmtExact(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  if (!isFinite(v)) return "∞";
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e9 || a < 1e-9)) return v.toExponential(6);
  let s = v.toFixed(12).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, ".0");
  if (s === "-0.0") s = "0.0";
  return s;
}
/* a group of related exact values (a coordinate's x/y, or an A/B/C
   triplet) should all carry the same number of decimals as each other,
   rather than each being trimmed to its own independent length */
function groupExact(nums, capDecimals) {
  capDecimals = capDecimals === undefined ? 12 : capDecimals;
  const finite = nums.map(v => (isFinite(v) && Math.abs(v) < 1e9) ? v : null);
  const strs = finite.map((v, idx) => v === null ? (!isFinite(nums[idx]) ? "∞" : nums[idx].toExponential(6)) : fmtExact(v));
  let maxDec = 0;
  strs.forEach((s, idx) => { if (finite[idx] === null) return; const dot = s.indexOf("."); if (dot >= 0) maxDec = Math.max(maxDec, s.length - dot - 1); });
  maxDec = Math.min(maxDec, capDecimals);
  return finite.map((v, idx) => v === null ? strs[idx] : v.toFixed(maxDec));
}
/* the sidebar's Exact/Approx toggle, same meaning as the explanation
   panel's own Exact/Approximate pair:
   Exact (the default) — the decimal value at the Decimals setting (4 by
     default), every value padded to that same number of places.
   Approx — the clean closed form (3/2, 2π/3 rad) when the value genuinely
     has one; anything without one shows the very same decimal as Exact. */
const numFmt = (v, d) => (S.exact ? fmt(v, d) : (fractionStr(v) || fmt(v, d)));

/* =======================================================================
   Fraction / π-multiple detection — for the explanation modal's own
   Approximate/Exact pair. A "nice" closed form (3/2, 3π) only gets
   offered when the geometry genuinely produces one (special angles, a
   3-4-5 triangle's ratios); an arbitrary irrational result never
   coincidentally lands within the tolerance of a small p/q, so this
   never fires a false positive for ordinary values.
   ======================================================================= */
function gcdInt(a, b) {
  a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
  while (b) { const t = b; b = a % b; a = t; }
  return a || 1;
}
function niceRatio(v, maxDen) {
  if (!isFinite(v) || v === 0) return null;
  const sign = v < 0 ? -1 : 1, av = Math.abs(v);
  for (let den = 1; den <= maxDen; den++) {
    const num = Math.round(av * den);
    if (num === 0) continue;
    if (Math.abs(av - num / den) < 1e-9 * Math.max(1, av)) {
      const g = gcdInt(num, den);
      return { num: sign * (num / g), den: den / g };

  return null;
}
/* a plain "p/q" — null unless q > 1, since an integer isn't a fraction
   form worth calling out separately from its own decimal */
function fractionStr(v, maxDen) {

  if (!f || f.den === 1) return null;

/* "3π", "π/4", "3π/4" — a rational multiple of π, however that reduces */

   (the sidebar's decimals stepper), never a fixed long dump — so "exact"
   here means "the actual number", not "as many digits as we can print" */
const lenDecimal   = (inches, U) => fmt(inches / LEN[U].f, S.prec) + " " + LEN[U].sym;
const lenSymbolic  = (inches, U) => { const f = fractionStr(inches / LEN[U].f); return f ? f + " " + LEN[U].sym : null; };
const areaDecimal  = (sqin, U) => fmt(sqin / (LEN[U].f * LEN[U].f), S.prec) + " " + LEN[U].sym + "²";
const areaSymbolic = (sqin, U) => { const f = fractionStr(sqin / (LEN[U].f * LEN[U].f)); return f ? f + " " + LEN[U].sym + "²" : null; };
const angDecimal   = rad => fmt(deg(rad), S.prec) + "°  /  " + fmt(rad, S.prec) + " rad";
const angSymbolic  = rad => { const p = piStr(rad); return p ? fmt(deg(rad), S.prec) + "°  /  " + p + " rad" : null; };
const plainDecimal  = v => fmt(v, S.prec);
const plainSymbolic = v => fractionStr(v);
const coordDecimal  = (x, y) => "(" + fmt(x, S.prec) + ", " + fmt(y, S.prec) + ")";
const coordSymbolic = (x, y) => {
  const fx = fractionStr(x), fy = fractionStr(y);
  if (!fx && !fy) return null;
  return "(" + (fx || fmt(x, S.prec)) + ", " + (fy || fmt(y, S.prec)) + ")";
};

/* =======================================================================
   Units — internal length unit is the INCH, internal angle unit is the RADIAN
   ======================================================================= */
const LEN = {
  mm: { f: 1 / 25.4,      sym: "mm", metric: true,  name: "Millimeters" },
  cm: { f: 1 / 2.54,      sym: "cm", metric: true,  name: "Centimeters" },
  m:  { f: 1 / 0.0254,    sym: "m",  metric: true,  name: "Meters" },
  km: { f: 1000 / 0.0254, sym: "km", metric: true,  name: "Kilometers" },
  in: { f: 1,             sym: "in", metric: false, name: "Inches" },
  ft: { f: 12,            sym: "ft", metric: false, name: "Feet" },
  yd: { f: 36,            sym: "yd", metric: false, name: "Yards" },
  mi: { f: 63360,         sym: "mi", metric: false, name: "Miles" }
};
const ANG = {
  deg:  { f: Math.PI / 180, sym: "°",    tight: true,  name: "Degrees" },
  rad:  { f: 1,             sym: "rad",                name: "Radians" },
  grad: { f: Math.PI / 200, sym: "grad",               name: "Gradians" }
};

const LEN_ALIAS = {}, ANG_ALIAS = {};
(function () {
  const put = (tbl, key, names) => names.forEach(n => tbl[n] = key);
  put(LEN_ALIAS, "mm", ["mm", "millimeter", "millimeters", "millimetre", "millimetres"]);
  put(LEN_ALIAS, "cm", ["cm", "centimeter", "centimeters", "centimetre", "centimetres"]);
  put(LEN_ALIAS, "m",  ["m", "meter", "meters", "metre", "metres"]);
  put(LEN_ALIAS, "km", ["km", "kilometer", "kilometers", "kilometre", "kilometres"]);
  put(LEN_ALIAS, "in", ["in", "inch", "inches", '"', "''", "″", "”"]);
  put(LEN_ALIAS, "ft", ["ft", "foot", "feet", "'", "′", "’"]);
  put(LEN_ALIAS, "yd", ["yd", "yard", "yards"]);
  put(LEN_ALIAS, "mi", ["mi", "mile", "miles"]);
  put(ANG_ALIAS, "deg",  ["deg", "degs", "degree", "degrees", "°", "d"]);
  put(ANG_ALIAS, "rad",  ["rad", "rads", "radian", "radians", "r"]);
  put(ANG_ALIAS, "grad", ["grad", "grads", "gradian", "gradians", "gon"]);
})();

/* plain = always the decimal, whatever the toggle says — for the editable
   pills, whose text gets parsed right back as input */
const lenStr  = (inches, k, d, plain) => (plain ? fmt : numFmt)(inches / LEN[k].f, d) + " " + LEN[k].sym;
const areaStr = (sqin,  k, d, plain) => (plain ? fmt : numFmt)(sqin / (LEN[k].f * LEN[k].f), d) + " " + LEN[k].sym + "²";
const angStr  = (r, k, d, plain) => {
  /* in radians the closed form is a multiple of π, not a bare fraction */
  if (!plain && !S.exact && k === "rad") { const p = piStr(r); if (p) return p + " rad"; }
  return (plain ? fmt : numFmt)(r / ANG[k].f, d) + (ANG[k].tight ? "" : " ") + ANG[k].sym;
};

function metricFor(inches) {
  const mm = Math.abs(inches) * 25.4;
  if (mm < 10) return "mm";
  if (mm < 1000) return "cm";
  if (mm < 1e6) return "m";
  return "km";
}
function imperialFor(inches) {
  const a = Math.abs(inches);
  if (a < 12) return "in";
  if (a < 63360) return "ft";
  return "mi";
}
const altLenUnit = (inches, k) => (LEN[k].metric ? imperialFor(inches) : metricFor(inches));
const altAngUnit = k => (k === "rad" ? "deg" : "rad");

/* --- parsing "3.4 mm", 3.4", 5'6", plain numbers ----------------------- */
const NUM_RE = /^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\s*(.*)$/;
const FEET_IN_RE = /^([+-]?(?:\d+\.?\d*|\.\d+))\s*(?:'|′|’|ft|feet|foot)\s*(\d+\.?\d*|\.\d+)\s*(?:"|''|″|”|in|inch|inches)?$/;

function normalizeNumeric(s) {
  if ((s.match(/,/g) || []).length === 1 && s.indexOf(".") === -1) return s.replace(",", ".");
  return s.replace(/,/g, "");

    0.5 * Math.sqrt(Math.max(0, 2 * a * a + 2 * c * c - b * b)),
    0.5 * Math.sqrt(Math.max(0, 2 * a * a + 2 * b * b - c * c))

  const span = Math.max(Math.max.apply(null, xs) - Math.min.apply(null, xs),
                        Math.max.apply(null, ys) - Math.min.apply(null, ys));
  if (span < 26 || span > 2.4 * Math.min(W, HH)) fitView(undefined, 400);
}

/* --- grid show/hide "assemble outward from center" animation ---------- */
function setGrid(on) {
  S.grid = on;
  if (S.gridAnimT) cancelAnimationFrame(S.gridAnimT);
  const from = S.gridAnim, to = on ? 1 : 0;
  const t0 = performance.now(), dur = 1800;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = clamp((now - t0) / dur, 0, 1);
    S.gridAnim = from + (to - from) * ease(t);
    requestRender();
    S.gridAnimT = t < 1 ? requestAnimationFrame(step) : null;
  };
  S.gridAnimT = requestAnimationFrame(step);
}

function niceStep(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}
function gridStep() {
  const f = LEN[S.lenUnit].f;
  return niceStep((90 / S.view.z) / f) * f;
}

function drawGrid() {
  if (S.gridAnim <= 0.001) return;
  /* always assembles from world (0,0), never the viewport's own center —
     so panning/zooming never changes where the animation starts from */
  const cxp = sx(0), cyp = sy(0);
  const maxR = Math.max(
    Math.hypot(cxp, cyp), Math.hypot(cxp - W, cyp),
    Math.hypot(cxp, cyp - HH), Math.hypot(cxp - W, cyp - HH)
  ) + 40;
  const revealR = maxR * S.gridAnim;

  ctx.save();
  ctx.beginPath(); ctx.arc(cxp, cyp, Math.max(0, revealR), 0, TAU); ctx.clip();

  const major = gridStep(), minor = major / 5;
  const x0 = wxAt(0), x1 = wxAt(W), y0 = wyAt(HH), y1 = wyAt(0);
  const pass = (step, color) => {
    if (step * S.view.z < 5) return;
    ctx.beginPath();
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
      const px = Math.round(sx(x)) + 0.5;
      ctx.moveTo(px, 0); ctx.lineTo(px, HH);
    }
    for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
      const py = Math.round(sy(y)) + 0.5;
      ctx.moveTo(0, py); ctx.lineTo(W, py);
    }
    ctx.stroke();
  };
  pass(minor, "rgba(128,128,128,.12)");
  pass(major, "rgba(128,128,128,.22)");

  ctx.beginPath();
  ctx.strokeStyle = "rgba(128,128,128,.4)"; ctx.lineWidth = 1;
  const ax = Math.round(sx(0)) + 0.5, ay = Math.round(sy(0)) + 0.5;
  if (ax > -1 && ax < W + 1) { ctx.moveTo(ax, 0); ctx.lineTo(ax, HH); }
  if (ay > -1 && ay < HH + 1) { ctx.moveTo(0, ay); ctx.lineTo(W, ay); }
  ctx.stroke();
  ctx.restore();
}

/* draws only the portion of the arc between fractions tStart and tEnd
   (0..1, measured along the sweep from the U-direction to the Wp-direction)
   — drawArc itself is just the tStart=0,tEnd=1 special case */
function drawArcPortion(V, U, Wp, radius, lw, color, tStart, tEnd) {
  let d1x = U.x - V.x, d1y = U.y - V.y, l1 = Math.hypot(d1x, d1y) || 1;
  let d2x = Wp.x - V.x, d2y = Wp.y - V.y, l2 = Math.hypot(d2x, d2y) || 1;
  d1x /= l1; d1y /= l1; d2x /= l2; d2y /= l2;
  const dot = clamp(d1x * d2x + d1y * d2y, -1, 1);
  const cross = d1x * d2y - d1y * d2x;
  const ang = Math.acos(dot) * (cross < 0 ? -1 : 1);
  const a0 = ang * tStart, a1 = ang * tEnd;
  if (Math.abs(a1 - a0) < 1e-6) return;
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const t = a0 + (a1 - a0) * i / 24, cs = Math.cos(t), sn = Math.sin(t);
    const dx = cs * d1x - sn * d1y, dy = sn * d1x + cs * d1y;
    const px = V.x + dx * radius, py = V.y + dy * radius;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
}
function drawArc(V, U, Wp, radius, lw, color) {
  drawArcPortion(V, U, Wp, radius, lw, color, 0, 1);
}
/* the lock-in/lock-out draw animation for an angle arc: two short arcs
   grow inward from each ray, meeting (or, in reverse, retreating back
   toward each ray) at the arc's midpoint — same shape as the pill ring */
function drawArcGrow(V, U, Wp, radius, lw, color, p) {
  const pc = clamp(p, 0, 1);
  drawArcPortion(V, U, Wp, radius, lw, color, 0, 0.5 * pc);
  drawArcPortion(V, U, Wp, radius, lw, color, 1 - 0.5 * pc, 1);
}
function drawRightAngle(V, U, Wp, size, color) {
  let d1x = U.x - V.x, d1y = U.y - V.y, l1 = Math.hypot(d1x, d1y) || 1;
  let d2x = Wp.x - V.x, d2y = Wp.y - V.y, l2 = Math.hypot(d2x, d2y) || 1;
  d1x /= l1; d1y /= l1; d2x /= l2; d2y /= l2;
  ctx.beginPath();
  ctx.moveTo(V.x + d1x * size, V.y + d1y * size);
  ctx.lineTo(V.x + (d1x + d2x) * size, V.y + (d1y + d2y) * size);
  ctx.lineTo(V.x + d2x * size, V.y + d2y * size);
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke();
}
/* same lock draw-in animation, for the right-angle bracket special case:
   its two segments (ray-to-corner, corner-to-ray) grow from each ray
   inward and meet at the bracket's own corner */
function drawRightAngleGrow(V, U, Wp, size, color, p) {
  let d1x = U.x - V.x, d1y = U.y - V.y, l1 = Math.hypot(d1x, d1y) || 1;
  let d2x = Wp.x - V.x, d2y = Wp.y - V.y, l2 = Math.hypot(d2x, d2y) || 1;
  d1x /= l1; d1y /= l1; d2x /= l2; d2y /= l2;
  const A = { x: V.x + d1x * size, y: V.y + d1y * size };
  const M = { x: V.x + (d1x + d2x) * size, y: V.y + (d1y + d2y) * size };
  const B = { x: V.x + d2x * size, y: V.y + d2y * size };
  const pc = clamp(p, 0, 1);
  ctx.strokeStyle = color; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(A.x + (M.x - A.x) * pc, A.y + (M.y - A.y) * pc); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.lineTo(B.x + (M.x - B.x) * pc, B.y + (M.y - B.y) * pc); ctx.stroke();
}

/* getComputedStyle forces the browser to flush any pending style/layout
   work before it can answer — calling it fresh on every single draw()
   (i.e. every animation frame during a drag) was a real, measurable
   source of the reported lag, on top of the pill DOM thrashing already
   fixed. These colors only ever change on an explicit theme toggle or a
   custom-color edit, so they're cached and only re-read then. */
let themeColorCache = null;
function themeColors() {
  if (!themeColorCache) {
    const rootStyle = getComputedStyle(document.documentElement);
    themeColorCache = {
      bg: rootStyle.getPropertyValue("--bg").trim(),
      lock: rootStyle.getPropertyValue("--lock").trim(),
      blue: rootStyle.getPropertyValue("--blue").trim()

  }
  return themeColorCache;
}
function invalidateThemeColors() { themeColorCache = null; }

function draw(D) {
  const dark = S.theme !== "light";
  ctx.clearRect(0, 0, W, HH);
  const colors = themeColors();
  ctx.fillStyle = colors.bg || (dark ? "#0b0b0d" : "#f4f4f6");
  ctx.fillRect(0, 0, W, HH);
  drawGrid();

  /* view-only's plain outline, at opacity a */
  const plainTri = a => {
    const q = S.P.map(toScreen);
    ctx.save(); ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.moveTo(q[0].x, q[0].y); ctx.lineTo(q[1].x, q[1].y); ctx.lineTo(q[2].x, q[2].y); ctx.closePath();
    ctx.fillStyle = dark ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.04)"; ctx.fill();
    ctx.strokeStyle = dark ? "#c9c9d1" : "#33333a"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  };
  /* S.viewFade runs 0 → 1 entering view-only (and back leaving it): the
     full annotated drawing fades out while the plain outline fades in,
     instead of every arc, label and handle vanishing in a single frame */
  const vf = S.viewFade;
  if (vf >= 1) { plainTri(1); return; }
  if (vf > 0) { ctx.save(); ctx.globalAlpha = 1 - vf; }

  const p = S.P.map(toScreen);
  const hv = S.hover;
  const fg = dark ? "#8f8f99" : "#7a7a84";
  const fgLock = dark ? "#e6e6ea" : "#33333a";
  const white = dark ? "#ffffff" : "#101012";
  const lockColor = colors.lock || "#ff5c5c";
  const blueColor = colors.blue || "#4ea1ff";

  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y); ctx.lineTo(p[1].x, p[1].y); ctx.lineTo(p[2].x, p[2].y);
  ctx.closePath();
  ctx.fillStyle = hv && hv.kind === "body" ? (dark ? "rgba(255,255,255,.075)" : "rgba(0,0,0,.06)")
                                            : (dark ? "rgba(255,255,255,.045)" : "rgba(0,0,0,.035)");
  ctx.fill();

  const cS = toScreen(D.centroid);
  ctx.save();
  ctx.setLineDash([2, 4]); ctx.strokeStyle = dark ? "rgba(255,255,255,.13)" : "rgba(0,0,0,.14)"; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const u = p[(i + 1) % 3], w = p[(i + 2) % 3];
    ctx.beginPath(); ctx.moveTo(p[i].x, p[i].y); ctx.lineTo((u.x + w.x) / 2, (u.y + w.y) / 2); ctx.stroke();
  }
  ctx.restore();

  for (let i = 0; i < 3; i++) {
    const u = p[(i + 1) % 3], w = p[(i + 2) % 3];
    const isHov = hv && hv.kind === "side" && hv.i === i;
    const locked = S.lock.side[i];
    const anim = S.lockAnim.side[i];
    ctx.lineCap = "round";
    if (anim) {
      /* base: the side's ordinary unlocked look, always fully drawn */
      ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(w.x, w.y);
      ctx.strokeStyle = isHov ? white : fg;
      ctx.lineWidth = isHov ? 3.2 : 1.9;
      ctx.stroke();
      /* the lock ring's own red draw-in, growing from each endpoint
         toward the midpoint (mirrors the pill's two-corner ring) */
      const midx = (u.x + w.x) / 2, midy = (u.y + w.y) / 2, pc = clamp(anim.p, 0, 1);
      ctx.strokeStyle = lockColor; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(u.x + (midx - u.x) * pc, u.y + (midy - u.y) * pc); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + (midx - w.x) * pc, w.y + (midy - w.y) * pc); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(w.x, w.y);
      ctx.strokeStyle = isHov ? white : locked ? lockColor : fg;
      ctx.lineWidth = isHov ? 3.2 : locked ? 2.8 : 1.9;
      ctx.stroke();
    }
  }

  for (let i = 0; i < 3; i++) {
    const u = p[(i + 1) % 3], w = p[(i + 2) % 3];
    const lim = Math.min(Math.hypot(u.x - p[i].x, u.y - p[i].y), Math.hypot(w.x - p[i].x, w.y - p[i].y));
    const rr = Math.min(34, lim * 0.3);
    if (rr < 6) continue;
    const isHov = hv && hv.kind === "vertex" && hv.i === i;
    const locked = S.lock.angle[i];
    const anim = S.lockAnim.angle[i];
    const col = isHov ? white : locked ? lockColor : fgLock;
    const isRight = isRightAngle(D.ang[i]); /* same rule as the Right chip and the trig panel */
    const size = Math.min(16, rr * 0.62);
    if (anim) {
      const baseCol = isHov ? white : fgLock, pc = clamp(anim.p, 0, 1);
      if (isRight) {
        drawRightAngle(p[i], u, w, size, baseCol);
        drawRightAngleGrow(p[i], u, w, size, lockColor, pc);
      } else {
        drawArc(p[i], u, w, rr, 1.4, baseCol);
        drawArcGrow(p[i], u, w, rr, 2.4, lockColor, pc);
      }
    } else if (isRight) drawRightAngle(p[i], u, w, size, col);
    else drawArc(p[i], u, w, rr, locked ? 2.4 : 1.4, col);
  }

  ctx.beginPath(); ctx.arc(cS.x, cS.y, 2, 0, TAU);
  ctx.fillStyle = dark ? "rgba(255,255,255,.3)" : "rgba(0,0,0,.3)"; ctx.fill();

  /* generic geometry highlight, driven by clicking a stat row */
  if (S.highlight) drawHighlight(D, S.highlight);

  const names = ["A", "B", "C"];
  for (let i = 0; i < 3; i++) {
    const isHov = hv && hv.kind === "vertex" && hv.i === i;
    const locked = S.lock.angle[i];
    const sel = S.selected.has(i);
    if (sel) { ctx.beginPath(); ctx.arc(p[i].x, p[i].y, 10, 0, TAU); ctx.strokeStyle = blueColor; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(p[i].x, p[i].y, isHov ? 7 : 5, 0, TAU);
    ctx.fillStyle = locked ? lockColor : (dark ? "#0b0b0d" : "#f4f4f6"); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = isHov || locked ? (locked ? lockColor : white) : (dark ? "#b8b8c2" : "#54545c");
    ctx.stroke();

    let ux = p[(i + 1) % 3].x - p[i].x, uy = p[(i + 1) % 3].y - p[i].y;
    let wx2 = p[(i + 2) % 3].x - p[i].x, wy2 = p[(i + 2) % 3].y - p[i].y;
    const lu = Math.hypot(ux, uy) || 1, lw = Math.hypot(wx2, wy2) || 1;
    let bx = -(ux / lu + wx2 / lw), by = -(uy / lu + wy2 / lw);
    const lb = Math.hypot(bx, by) || 1; bx /= lb; by /= lb;
    ctx.font = "600 12px Inter, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = dark ? "#8a8a94" : "#6a6a74";
    ctx.fillText(names[i], p[i].x + bx * 20, p[i].y + by * 20);
  }

  if (vf > 0) { ctx.restore(); plainTri(vf); }
}

/* draws the arc from pStart to pEnd around center whose sweep magnitude
   best matches targetAngleRad — the actual known central angle for that
   arc (2·angle for the circumcircle, π−angle for the incircle). Picking
   the arc this way, instead of guessing a side to swing away from, can
   never end up highlighting the wrong (complementary) arc: whichever of
   the two directions actually has that length is the one drawn. */
function drawArcByLength(center, r, pStart, pEnd, targetAngleRad, color, lw) {
  const a0 = Math.atan2(pStart.y - center.y, pStart.x - center.x);
  const a1 = Math.atan2(pEnd.y - center.y, pEnd.x - center.x);
  const norm = x => { let v = x % TAU; while (v < 0) v += TAU; while (v >= TAU) v -= TAU; return v; };
  const ccw = norm(a1 - a0), cw = TAU - ccw;
  const sweep = Math.abs(ccw - targetAngleRad) <= Math.abs(cw - targetAngleRad) ? ccw : -cw;
  ctx.beginPath();
  for (let k = 0; k <= 48; k++) {
    const t = a0 + sweep * k / 48;
    const px = center.x + Math.cos(t) * r, py = center.y + Math.sin(t) * r;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
}

function drawHighlight(D, h) {
  const p = S.P.map(toScreen);
  ctx.save();
  ctx.strokeStyle = "#4ea1ff"; ctx.lineWidth = 3.4; ctx.lineCap = "round"; ctx.lineJoin = "round";

  if (h.kind === "side") {
    const u = p[(h.i + 1) % 3], w = p[(h.i + 2) % 3];
    ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(w.x, w.y); ctx.stroke();
  } else if (h.kind === "vertex") {
    ctx.beginPath(); ctx.arc(p[h.i].x, p[h.i].y, 12, 0, TAU); ctx.stroke();
  } else if (h.kind === "point") {
    const q = toScreen(h.get ? h.get(D) : D[h.which]);
    ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, TAU); ctx.fillStyle = "#4ea1ff"; ctx.fill();

  } else if (h.kind === "all") {
    ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y); ctx.lineTo(p[1].x, p[1].y); ctx.lineTo(p[2].x, p[2].y); ctx.closePath();
    ctx.lineWidth = 3; ctx.stroke();

  } else if (h.kind === "circle") {
    /* R / Rd / r / rd — draw the real circumcircle or incircle, plus a
       radius or diameter line, using this triangle's actual geometry */
    const center = h.which === "circ" ? D.circum : D.incenter;
    const rad = h.which === "circ" ? D.R : D.r;
    const q = toScreen(center), R2 = rad * S.view.z;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(q.x, q.y, R2, 0, TAU); ctx.stroke();
    ctx.fillStyle = "#4ea1ff";
    ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, TAU); ctx.fill();
    ctx.lineWidth = 2.6;
    const anchor = h.which === "circ" ? p[0] : toScreen(D.touch[0]);
    let dx = anchor.x - q.x, dy = anchor.y - q.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    ctx.beginPath();
    if (h.mode === "diameter") { ctx.moveTo(q.x - dx * R2, q.y - dy * R2); ctx.lineTo(q.x + dx * R2, q.y + dy * R2); }
    else { ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + dx * R2, q.y + dy * R2); }
    ctx.stroke();

  } else if (h.kind === "arcCirc") {
    const q = toScreen(D.circum);
    ctx.beginPath(); ctx.arc(q.x, q.y, D.R * S.view.z, 0, TAU);
    ctx.strokeStyle = "rgba(78,161,255,.32)"; ctx.lineWidth = 1.4; ctx.stroke();
    const j = (h.i + 1) % 3, k = (h.i + 2) % 3;
    drawArcByLength(q, D.R * S.view.z, p[j], p[k], 2 * D.ang[h.i], "#4ea1ff", 3.4);

  } else if (h.kind === "arcIn") {
    const q = toScreen(D.incenter);
    ctx.beginPath(); ctx.arc(q.x, q.y, D.r * S.view.z, 0, TAU);
    ctx.strokeStyle = "rgba(78,161,255,.32)"; ctx.lineWidth = 1.4; ctx.stroke();
    const j = (h.i + 1) % 3, k = (h.i + 2) % 3;
    const t1 = toScreen(D.touch[j]), t2 = toScreen(D.touch[k]);
    drawArcByLength(q, D.r * S.view.z, t1, t2, Math.PI - D.ang[h.i], "#4ea1ff", 3.4);
    ctx.fillStyle = "#4ea1ff";
    [t1, t2].forEach(t => { ctx.beginPath(); ctx.arc(t.x, t.y, 3, 0, TAU); ctx.fill(); });

  } else if (h.kind === "cevian") {
    const i = h.i, from = p[i];
    if (h.type === "alt") {
      const foot = toScreen(D.altFoot[i]);
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();
      const j = (i + 1) % 3, k = (i + 2) % 3;
      let dx = p[k].x - p[j].x, dy = p[k].y - p[j].y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      let nx = -dy, ny = dx;
      if ((from.x - foot.x) * nx + (from.y - foot.y) * ny < 0) { nx = -nx; ny = -ny; }
      const sz = 8;
      ctx.beginPath();
      ctx.moveTo(foot.x + dx * sz, foot.y + dy * sz);
      ctx.lineTo(foot.x + dx * sz + nx * sz, foot.y + dy * sz + ny * sz);
      ctx.lineTo(foot.x + nx * sz, foot.y + ny * sz);
      ctx.lineWidth = 1.6; ctx.stroke();
    } else if (h.type === "med") {
      const foot = toScreen(D.medFoot[i]);
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();
      ctx.fillStyle = "#4ea1ff"; ctx.beginPath(); ctx.arc(foot.x, foot.y, 4, 0, TAU); ctx.fill();
    } else if (h.type === "bis") {
      const foot = toScreen(D.bisFoot[i]);
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();
      const j = (i + 1) % 3, k = (i + 2) % 3;
      drawArc(from, p[j], foot, 18, 1.8, "#4ea1ff");
      drawArc(from, foot, p[k], 18, 1.8, "#4ea1ff");
    }
  }
  ctx.restore();
}

/* =======================================================================
   Pills — one input per corner and per side, plus per-vertex coordinates
   ======================================================================= */
const overlay = document.getElementById("overlay");
const pills = [];

/* measures the pill input's text with a throwaway canvas context instead
   of a hidden DOM element + offsetWidth — that pattern needs a WRITE
   (set its text) immediately followed by a layout-forcing READ, once per
   pill, every single frame. Interleaved like that across 6 pills plus
   the rest of layoutPills' own reads/writes, it was forcing a full
   synchronous reflow more than a dozen times per frame during a drag —
   the actual source of the reported lag, not the constraint solver
   (which measures under 0.05ms). canvas measureText has no layout
   dependency at all, so this can never force a reflow. */
const measureCtx = document.createElement("canvas").getContext("2d");
measureCtx.font = "500 12px Inter, sans-serif";

function autoWidth(input) {
  const w = measureCtx.measureText(input.value || " ").width;
  input.style.width = Math.max(44, Math.ceil(w) + 6) + "px";
}
/* the x/y coordinate boxes had a fixed 38px width, which clipped their
   numbers ("-1.3325" cut to "-1.332") as soon as a value had a couple of
   integer digits or more decimals — sized to their text the same way */
const coordMeasureCtx = document.createElement("canvas").getContext("2d");
coordMeasureCtx.font = "500 10px Inter, sans-serif";

/* ONE source for every trig value on screen — the sidebar table and the
   explanation panel both read trigData(), and both print through trigSafe,
   so the two can never disagree.

   Which method is used depends on the triangle, because SOH-CAH-TOA is
   only defined on a RIGHT triangle's own sides:

   mode "sides" — the triangle has a right angle at r, and i is one of the
     other two angles: SOH-CAH-TOA on the triangle's real sides.
     opposite = side i, hypotenuse = side r, adjacent = the remaining leg.
   mode "right" — i IS the right angle: it has no opposite/adjacent pair;
     sin 90° = 1, cos 90° = 0, tan 90° / sec 90° are undefined.
   mode "general" — no right angle: there's no hypotenuse, so SOH-CAH-TOA
     does not apply. The two laws that hold for EVERY triangle give the
     values from its real sides instead:
       Law of Sines     a / sin A = b / sin B = c / sin C = 2R
                          ⇒ sin A = a / (2R)   (R = circumradius)
       Law of Cosines   cos A = (b² + c² − a²) / (2·b·c)
     and tan = sin / cos, csc = 1 / sin, sec = 1 / cos, cot = cos / sin by
     definition.

   Numerically, sin and cos are evaluated as |u×v| / (|u||v|) and
   u·v / (|u||v|) from the vertex coordinates (u, v = the two sides leaving
   the vertex). Those are exactly a/(2R) and (b²+c²−a²)/(2bc) — the same
   numbers — but computed without subtracting nearly-equal squares, which
   on a thin sliver of a triangle lost ~9 of 16 digits. */
const TRIG_RAW = {
  sin: t => t.opposite / t.hypotenuse, cos: t => t.adjacent / t.hypotenuse, tan: t => t.opposite / t.adjacent,
  csc: t => t.hypotenuse / t.opposite, sec: t => t.hypotenuse / t.adjacent, cot: t => t.adjacent / t.opposite
};
/* "is this a right angle?" — ONE rule for the whole app (the Right chip,
   the right-angle square drawn on the canvas, and the trig method):
   exactly when the angle reads 90 at the current decimal setting. The
   three used to disagree (0.0057° vs 0.23° vs display tolerance), so a
   corner showing 89.8° could get a right-angle square drawn on it. */
function isRightAngle(rad) {
  const tol = Math.max(0.5 * Math.pow(10, -S.prec), 1e-9); /* in degrees */
  return Math.abs(deg(rad) - 90) < tol;
}
function rightVertex(D) {
  if (!D.ang) return -1;
  for (let i = 0; i < 3; i++) if (isRightAngle(D.ang[i])) return i;
  return -1;
}
function trigData(D) {
  const r = rightVertex(D);
  return [0, 1, 2].map(i => {
    const j = (i + 1) % 3, k = (i + 2) % 3;
    if (r === i) return { mode: "right", opposite: D.sides[i], adjacent: 0, hypotenuse: D.sides[i] };
    if (r >= 0) {
      const t = 3 - i - r; /* the leg that isn't opposite angle i */
      return { mode: "sides", opposite: D.sides[i], adjacent: D.sides[t], hypotenuse: D.sides[r],
               sideOf: { opposite: i, adjacent: t, hypotenuse: r } };
    }
    const P = D.P || S.P, pi = P[i], pj = P[j], pk = P[k];
    const ux = pj.x - pi.x, uy = pj.y - pi.y, vx = pk.x - pi.x, vy = pk.y - pi.y;
    const dot = ux * vx + uy * vy, cross = Math.abs(ux * vy - uy * vx);
    const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy); /* side k and side j */
    return { mode: "general", sin: cross / (lu * lv), cos: dot / (lu * lv) };
  });
}
function trigRatio(t, fn) {
  if (t.mode === "general") {
    return { sin: t.sin, cos: t.cos, tan: t.sin / t.cos, csc: 1 / t.sin, sec: 1 / t.cos, cot: t.cos / t.sin }[fn];
  }
  return TRIG_RAW[fn](t);
}
/* the Law of Sines line (sin) and Law of Cosines line (cos) for angle i,
   shared by the trig panel and the angle explanation. Each builder prints
   its final value at nOut decimals, and prints every input just precisely
   enough that redoing the arithmetic by hand from the digits on screen
   gives exactly the next printed step — never "off by one" in the last
   digit. `tail` replaces the final value (e.g. with a clickable answer). */
function lawLines(D, i) {
  const U = S.lenUnit, f = LEN[U].f, sym = LEN[U].sym;
  const names = ["A", "B", "C"], lname = ["a", "b", "c"];
  const j = (i + 1) % 3, k = (i + 2) % 3;
  const p = lname[j], q = lname[k], o = lname[i], nm = names[i];
  const r = (v, n) => +v.toFixed(n);
  /* same coordinate formulas as trigData "general" — identical numbers */
  const P = D.P || S.P, pi = P[i], pj = P[j], pk = P[k];
  const ux = pj.x - pi.x, uy = pj.y - pi.y, vx = pk.x - pi.x, vy = pk.y - pi.y;
  const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
  const sv = Math.abs(ux * vy - uy * vx) / (lu * lv), cv_ = (ux * vx + uy * vy) / (lu * lv);
  const sp = D.sides[j] / f, sq_ = D.sides[k] / f, so = D.sides[i] / f, Rv = D.R / f;
  const Nv = cv_ * 2 * sp * sq_, Dv = 2 * sp * sq_; /* b² + c² − a² and 2bc, display units² */
  const vHl = { kind: "vertex", i };
  const tf = (v, n) => trigSafe(v, true, n);
  const lenH = (v, letter, n) => NC2(fmt(v, n) + " " + sym, letter);
  const sqH  = (v, letter, n) => NC2(fmt(v * v, n) + " " + sym + "²", letter);
  const nm2 = V(nm, nm);

  /* sin via the Law of Sines, its final value printed at nOut decimals;
     the inputs a and R get however many decimals it takes for
     a ÷ (2·R), redone from the printed digits, to print as that value */
  const sinLine = (nOut, tail) => {
    let m = 15;
    for (let n = nOut; n <= 15; n++) if (tf(r(so, n) / (2 * r(Rv, n)), nOut) === tf(sv, nOut)) { m = n; break; }
    return "sin(" + nm2 + ") = " + FR(V(o, o), "2 · " + V("R", "R")) +
      " = " + FR(lenH(so, o, m), "2 · " + lenH(Rv, "R", m)) + " = " + (tail || NH(tf(sv, nOut), vHl));
  };
  /* cos via the Law of Cosines, final value at nOut decimals; the
     evaluated top/bottom (n2) and the substituted squares/products (m)
     are each printed precisely enough to reproduce the next step */
  const cosLine = (nOut, tail) => {
    let n2 = 15, m = 15;
    for (let n = nOut; n <= 15; n++) if (tf(r(Nv, n) / r(Dv, n), nOut) === tf(cv_, nOut)) { n2 = n; break; }
    for (let n = n2; n <= 15; n++) {
      const top = r(sp * sp, n) + r(sq_ * sq_, n) - r(so * so, n), bot = 2 * r(sp, n) * r(sq_, n);
      if (fmt(top, n2) === fmt(Nv, n2) && fmt(bot, n2) === fmt(Dv, n2)) { m = n; break; }
    }
    return "cos(" + nm2 + ") = " + FR(V(p + "²", p) + " + " + V(q + "²", q) + " − " + V(o + "²", o), "2 · " + V(p, p) + " · " + V(q, q)) +
      " = " + FR(sqH(sp, p, m) + " + " + sqH(sq_, q, m) + " − " + sqH(so, o, m), "2 · " + lenH(sp, p, m) + " · " + lenH(sq_, q, m)) +
      " = " + FR(NH(fmt(Nv, n2) + " " + sym + "²", vHl), NH(fmt(Dv, n2) + " " + sym + "²", vHl)) + " = " + (tail || NH(tf(cv_, nOut), vHl));
  };
  return { sin: sv, cos: cv_, sinLine, cosLine };
}

/* plain = always the decimal (the explanation panel's derivation lines);
   otherwise it follows the Exact/Approx toggle like every other stat */
function trigSafe(v, plain, digits) {
  if (Number.isNaN(v)) return "—";
  /* only ever reached by dividing by exactly 0 — tan 90°, sec 90°: the
     value doesn't exist, it isn't "infinity" */
  if (!isFinite(v)) return "undefined";
  /* these are unitless ratios of order 1 — anything this small is float
     noise (cos of a rotated right angle), not a real value */
  if (Math.abs(v) < 1e-12) v = 0;
  /* a genuinely huge (but real) value, e.g. tan 89.99999°: show the
     number itself compactly rather than calling it infinite */
  if (Math.abs(v) >= 1e7) return v.toExponential(2).replace("e+", "e");
  const d = digits === undefined ? S.prec : digits;
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) return (0).toFixed(d);
  return plain ? fmt(v, d) : numFmt(v, d);
}

let lastChipKey = null;
function updateStats(D) {
  const d = S.prec, U = S.lenUnit;
  const alt = s => " <span class='alt'>(" + s + ")</span>";
  const L    = v => lenStr(v, U, d) + alt(lenStr(v, altLenUnit(v, U), d));
  const AREA = v => areaStr(v, U, d) + alt(areaStr(v, altLenUnit(Math.sqrt(Math.abs(v)), U), d));
  const ANGLE = r => (S.angUnit === "rad" ? angStr(r, "rad", d) + alt(angStr(r, "deg", d))
                                          : angStr(r, "deg", d) + alt(angStr(r, "rad", d)));
  const sc = Math.max(D.a, D.b, D.c);
  const PT = p => {
    const x = snapNoise(p.x, sc) / LEN[U].f, y = snapNoise(p.y, sc) / LEN[U].f;
    return "(" + numFmt(x, d) + ", " + numFmt(y, d) + ")"; /* coordinates are plain numbers, not a length — no unit */
  };

  refs.a.innerHTML = L(D.a); refs.b.innerHTML = L(D.b); refs.c.innerHTML = L(D.c);
  refs.A.innerHTML = ANGLE(D.A); refs.B.innerHTML = ANGLE(D.B); refs.C.innerHTML = ANGLE(D.C);
  refs.sum.innerHTML = ANGLE(Math.PI); refs.sum.classList.add("dim");

  refs.area.innerHTML = AREA(D.area);
  refs.per.innerHTML  = L(D.per);
  refs.semi.innerHTML = L(D.s);
  refs.class.textContent = D.kind + " · " + D.shape;

  /* the six classification chips only change at the rare instant the
     triangle crosses into a different kind/shape — rebuilding all six
     DOM nodes from scratch on every frame regardless was pure churn */
  const chipKey = D.kind + "|" + D.shape;
  if (chipKey !== lastChipKey) {
    lastChipKey = chipKey;
    const chips = document.getElementById("chips");
    chips.innerHTML = "";
    [["Acute", D.kind === "Acute"], ["Right", D.kind === "Right"], ["Obtuse", D.kind === "Obtuse"],
     ["Scalene", D.shape === "Scalene"], ["Isosceles", D.shape === "Isosceles"], ["Equilateral", D.shape === "Equilateral"]
    ].forEach(([n, on]) => {
      const c = document.createElement("div"); c.className = "chip" + (on ? " on" : ""); c.textContent = n; chips.appendChild(c);
    });
  }

  const td = trigData(D);
  for (let i = 0; i < 3; i++) {
    for (const fn in TRIG_RAW) refs["tg_" + fn + "_" + i].textContent = trigSafe(trigRatio(td[i], fn));
  }

  refs.R.innerHTML = L(D.R); refs.Rd.innerHTML = L(2 * D.R);
  refs.r.innerHTML = L(D.r); refs.rd.innerHTML = L(2 * D.r);
  refs.Rr.textContent = numFmt(D.R / D.r, d);
  refs.inA.innerHTML  = AREA(Math.PI * D.r * D.r);
  refs.cirA.innerHTML = AREA(Math.PI * D.R * D.R);
  refs.arcC0.innerHTML = L(D.arcCirc[0]); refs.arcC1.innerHTML = L(D.arcCirc[1]); refs.arcC2.innerHTML = L(D.arcCirc[2]);
  refs.arcI0.innerHTML = L(D.arcIn[0]); refs.arcI1.innerHTML = L(D.arcIn[1]); refs.arcI2.innerHTML = L(D.arcIn[2]);

  for (let i = 0; i < 3; i++) { refs["h" + i].innerHTML = L(D.alt[i]); refs["m" + i].innerHTML = L(D.med[i]); refs["t" + i].innerHTML = L(D.bis[i]); }

  refs.pA.textContent = PT(D.P[0]); refs.pB.textContent = PT(D.P[1]); refs.pC.textContent = PT(D.P[2]);
  refs.cen.textContent = PT(D.centroid); refs.inc.textContent = PT(D.incenter);
  refs.cir.textContent = PT(D.circum);   refs.ort.textContent = PT(D.ortho);
  ["pA","pB","pC","cen","inc","cir","ort"].forEach(k => refs[k].classList.add("dim"));
}
